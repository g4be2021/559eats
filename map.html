<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>559eats · Map</title>
  <meta name="description" content="Find restaurants and food trucks near you in Fresno and the 559." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --coral: #D85A30;
      --coral-dark: #4A1B0C;
      --coral-light: #FAECE7;
      --coral-mid: #F0997B;
      --cream: #FBF7F2;
      --ink: #1A1208;
      --ink-muted: #6B5C4E;
      --ink-faint: #C2B5A8;
      --white: #FFFFFF;
      --card-border: rgba(26,18,8,0.08);
      --radius: 14px;
      --radius-sm: 8px;
      --panel-width: 360px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      overflow: hidden;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(251,247,242,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 0 2rem;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 900;
      color: var(--coral); letter-spacing: -0.5px;
      text-decoration: none;
    }
    .nav-links { display: flex; align-items: center; gap: 20px; }
    .nav-links a {
      font-size: 13px; font-weight: 500; color: var(--ink-muted);
      text-decoration: none; transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a.active { color: var(--coral); }
    .nav-cta {
      background: var(--coral); color: var(--white) !important;
      padding: 7px 16px; border-radius: 20px;
    }
    .nav-cta:hover { background: var(--coral-dark) !important; color: var(--white) !important; }

    /* LAYOUT */
    .app {
      display: flex;
      height: 100vh;
      padding-top: 60px;
    }

    /* SIDE PANEL */
    .panel {
      width: var(--panel-width);
      flex-shrink: 0;
      background: var(--cream);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .panel-search {
      display: flex; gap: 8px; margin-bottom: 10px;
    }
    .panel-search input {
      flex: 1; padding: 9px 14px;
      border: 1px solid var(--card-border);
      border-radius: 25px; outline: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; background: var(--white);
      color: var(--ink); transition: border-color 0.2s;
    }
    .panel-search input:focus { border-color: var(--coral); }
    .near-me-btn {
      padding: 9px 14px; border-radius: 25px;
      background: var(--coral); color: var(--white);
      border: none; font-size: 13px; font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; white-space: nowrap;
      transition: background 0.2s;
    }
    .near-me-btn:hover { background: var(--coral-dark); }
    .near-me-btn.locating { background: var(--ink-muted); cursor: wait; }

    .filter-row {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .chip {
      padding: 4px 12px; border-radius: 15px;
      font-size: 12px; border: 1px solid var(--card-border);
      background: var(--white); color: var(--ink-muted);
      cursor: pointer; transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    .chip:hover { border-color: var(--coral); color: var(--coral); }
    .chip.active { background: var(--coral); color: var(--white); border-color: var(--coral); }

    .panel-results {
      flex: 1; overflow-y: auto;
      padding: 10px 12px;
    }
    .results-count {
      font-size: 11px; color: var(--ink-muted);
      padding: 4px 4px 10px;
      font-weight: 500;
    }

    /* RESTAURANT CARD IN PANEL */
    .r-item {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background 0.15s;
      border: 1px solid transparent;
      margin-bottom: 6px;
    }
    .r-item:hover { background: var(--white); border-color: var(--card-border); }
    .r-item.active { background: var(--white); border-color: var(--coral); }
    .r-item-icon {
      width: 48px; height: 48px; border-radius: 10px;
      background: var(--coral-light); display: flex;
      align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .r-item-icon.truck { background: #FAEEDA; }
    .r-item-info { flex: 1; min-width: 0; }
    .r-item-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-item-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 4px; }
    .r-item-footer { display: flex; align-items: center; gap: 6px; }
    .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 8px;
      background: #F1EFE8; color: var(--ink-muted);
    }
    .badge.open { background: #EAF3DE; color: #27500A; }
    .badge.truck-badge { background: #FAEEDA; color: #633806; }
    .stars { font-size: 11px; color: #BA7517; }
    .distance { font-size: 11px; color: var(--coral); font-weight: 500; }

    .empty-state {
      text-align: center; padding: 2rem 1rem;
      color: var(--ink-muted); font-size: 13px;
    }

    /* MAP */
    .map-container {
      flex: 1;
      position: relative;
    }
    #map {
      width: 100%; height: 100%;
    }

    /* INFO POPUP on map */
    .map-popup {
      position: absolute;
      background: var(--white);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      min-width: 220px;
      max-width: 280px;
      z-index: 10;
      pointer-events: none;
      display: none;
    }
    .map-popup.visible { display: block; }
    .popup-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
    .popup-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 8px; }
    .popup-footer { display: flex; gap: 6px; align-items: center; }

    /* NEAR ME RADIUS CIRCLE label */
    .radius-label {
      position: absolute; bottom: 16px; right: 16px;
      background: var(--white); border: 1px solid var(--card-border);
      border-radius: 25px; padding: 6px 14px;
      font-size: 12px; color: var(--ink-muted);
      z-index: 5; display: none;
    }
    .radius-label.visible { display: block; }

    /* LOADING */
    .skeleton {
      background: linear-gradient(90deg, #f0ebe4 25%, #e8e1d8 50%, #f0ebe4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* MOBILE */
    @media (max-width: 700px) {
      .app { flex-direction: column; }
      .panel {
        width: 100%; height: 45vh;
        border-right: none;
        border-bottom: 1px solid var(--card-border);
      }
      .map-container { height: 55vh; }
      .nav-links a:not(.nav-cta) { display: none; }
    }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SM0VBC86SK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SM0VBC86SK');
  </script>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">559eats</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="map.html" class="active">Map</a>
    <a href="#">Food trucks</a>
    <a href="#" class="nav-cta">List your spot</a>
  </div>
</nav>

<div class="app">

  <!-- SIDE PANEL -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-search">
        <input type="text" id="map-search" placeholder="Search restaurants..." oninput="filterList()" />
        <button class="near-me-btn" id="near-me-btn" onclick="findNearMe()">📍 Near me</button>
      </div>
      <div class="filter-row">
        <button class="chip active" onclick="setFilter(this,'')">All</button>
        <button class="chip" onclick="setFilter(this,'restaurant')">Restaurants</button>
        <button class="chip" onclick="setFilter(this,'truck')">Food trucks</button>
        <button class="chip" onclick="setFilter(this,'Mexican')">Mexican</button>
        <button class="chip" onclick="setFilter(this,'BBQ')">BBQ</button>
        <button class="chip" onclick="setFilter(this,'Vietnamese')">Vietnamese</button>
      </div>
    </div>
    <div class="panel-results" id="panel-results">
      <div class="results-count" id="results-count"></div>
      <div id="list-container">
        <div class="r-item"><div class="r-item-icon skeleton" style="font-size:0"></div><div class="r-item-info"><div class="skeleton" style="height:14px;width:70%;margin-bottom:6px"></div><div class="skeleton" style="height:11px;width:50%"></div></div></div>
        <div class="r-item"><div class="r-item-icon skeleton" style="font-size:0"></div><div class="r-item-info"><div class="skeleton" style="height:14px;width:70%;margin-bottom:6px"></div><div class="skeleton" style="height:11px;width:50%"></div></div></div>
        <div class="r-item"><div class="r-item-icon skeleton" style="font-size:0"></div><div class="r-item-info"><div class="skeleton" style="height:14px;width:70%;margin-bottom:6px"></div><div class="skeleton" style="height:11px;width:50%"></div></div></div>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div class="map-container">
    <div id="map"></div>
    <div class="radius-label" id="radius-label">Showing within 5 miles</div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://wlpugteoycouvvnhamnm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndscHVndGVveWNvdXZ2bmhhbW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzY3MjksImV4cCI6MjA5MTQxMjcyOX0.RndK-tL1KG7Yg23JxtMqRlv5rECd6ppJubwNwoM2d5g';
  const MAPS_KEY = 'AIzaSyAgV7K00A0_7KCSimsDEfS2y4aJ61nE_Jw';

  const ICONS = {
    'Mexican':'🌮','Vietnamese':'🍜','BBQ':'🍖','Pizza':'🍕',
    'Hawaiian Fusion':'🍱','Asian Street Food':'🥡',
    'Mexican Street Food':'🌯','default':'🍽️'
  };

  let map, userMarker, radiusCircle;
  let allPlaces = [];
  let markers = [];
  let activeFilter = '';
  let userLocation = null;
  let activeItemId = null;

  async function fetchPlaces() {
    const url = `${SUPABASE_URL}/rest/v1/restaurants?status=eq.approved&is_active=eq.true&order=name`;
    const res = await fetch(url, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    return res.json();
  }

  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 36.7783, lng: -119.7945 },
      zoom: 12,
      styles: [
        { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] },
        { featureType: 'transit', stylers: [{ visibility: 'off' }] },
        { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#f5f0ea' }] },
        { featureType: 'road.arterial', elementType: 'geometry', stylers: [{ color: '#ede7df' }] },
        { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#e5ddd4' }] },
        { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#c9e0f0' }] },
        { featureType: 'landscape', elementType: 'geometry', stylers: [{ color: '#fbf7f2' }] },
        { featureType: 'administrative', elementType: 'geometry.stroke', stylers: [{ color: '#d4c9bc' }] }
      ],
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER }
    });

    fetchPlaces().then(places => {
      allPlaces = places;
      renderMarkers(places);
      renderList(places);
    });
  }

  function makeMarkerIcon(isTruck, isActive) {
    const color = isTruck ? '#BA7517' : (isActive ? '#D85A30' : '#4A1B0C');
    const scale = isActive ? 1.3 : 1;
    return {
      path: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z',
      fillColor: color,
      fillOpacity: 1,
      strokeColor: '#fff',
      strokeWeight: 2,
      scale: scale,
      anchor: new google.maps.Point(12, 22),
    };
  }

  function renderMarkers(places) {
    markers.forEach(m => m.setMap(null));
    markers = [];

    places.forEach(place => {
      if (!place.latitude || !place.longitude) return;

      const marker = new google.maps.Marker({
        position: { lat: place.latitude, lng: place.longitude },
        map,
        title: place.name,
        icon: makeMarkerIcon(place.is_food_truck, false),
        animation: google.maps.Animation.DROP,
      });

      marker.addListener('click', () => selectPlace(place, marker));
      markers.push(marker);
      marker._place = place;
    });
  }

  function selectPlace(place, marker) {
    markers.forEach(m => m.setIcon(makeMarkerIcon(m._place.is_food_truck, false)));
    marker.setIcon(makeMarkerIcon(place.is_food_truck, true));
    marker.setAnimation(google.maps.Animation.BOUNCE);
    setTimeout(() => marker.setAnimation(null), 700);

    map.panTo({ lat: place.latitude, lng: place.longitude });

    activeItemId = place.id;
    document.querySelectorAll('.r-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === place.id);
    });
    const activeEl = document.querySelector(`.r-item[data-id="${place.id}"]`);
    if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function renderList(places) {
    const container = document.getElementById('list-container');
    const countEl = document.getElementById('results-count');

    const filtered = applyFilters(places);
    countEl.textContent = `${filtered.length} spot${filtered.length !== 1 ? 's' : ''} found`;

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state">No spots found.<br>Try a different filter.</div>';
      return;
    }

    container.innerHTML = filtered.map(r => {
      const dist = userLocation ? getDistance(userLocation.lat, userLocation.lng, r.latitude, r.longitude) : null;
      return `
        <div class="r-item ${r.id === activeItemId ? 'active' : ''}" data-id="${r.id}" onclick="clickListItem('${r.id}')">
          <div class="r-item-icon ${r.is_food_truck ? 'truck' : ''}">${ICONS[r.cuisine_type] || ICONS.default}</div>
          <div class="r-item-info">
            <div class="r-item-name">${r.name}</div>
            <div class="r-item-meta">${r.cuisine_type} · ${r.neighborhood}</div>
            <div class="r-item-footer">
              <span class="stars">★★★★★</span>
              <span class="badge open">Open</span>
              ${r.is_food_truck ? '<span class="badge truck-badge">Food truck</span>' : ''}
              ${dist !== null ? `<span class="distance">${dist} mi</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function clickListItem(id) {
    const place = allPlaces.find(p => p.id === id);
    if (!place || !place.latitude) return;
    const marker = markers.find(m => m._place.id === id);
    if (marker) selectPlace(place, marker);
    map.setZoom(15);
  }

  function applyFilters(places) {
    const q = document.getElementById('map-search').value.toLowerCase().trim();
    return places.filter(r => {
      if (activeFilter === 'restaurant' && r.is_food_truck) return false;
      if (activeFilter === 'truck' && !r.is_food_truck) return false;
      if (activeFilter && activeFilter !== 'restaurant' && activeFilter !== 'truck') {
        if (r.cuisine_type !== activeFilter) return false;
      }
      if (q) {
        return r.name.toLowerCase().includes(q) ||
               (r.cuisine_type||'').toLowerCase().includes(q) ||
               (r.neighborhood||'').toLowerCase().includes(q);
      }
      return true;
    });
  }

  function setFilter(el, val) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    activeFilter = val;
    const filtered = applyFilters(allPlaces);
    renderMarkers(filtered);
    renderList(allPlaces);
  }

  function filterList() {
    renderList(allPlaces);
    const filtered = applyFilters(allPlaces);
    renderMarkers(filtered);
  }

  function findNearMe() {
    const btn = document.getElementById('near-me-btn');
    if (!navigator.geolocation) { alert('Geolocation not supported by your browser.'); return; }
    btn.textContent = 'Locating...';
    btn.classList.add('locating');

    navigator.geolocation.getCurrentPosition(pos => {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      btn.textContent = '📍 Near me';
      btn.classList.remove('locating');

      if (userMarker) userMarker.setMap(null);
      if (radiusCircle) radiusCircle.setMap(null);

      userMarker = new google.maps.Marker({
        position: userLocation,
        map,
        title: 'You are here',
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          fillColor: '#4285F4',
          fillOpacity: 1,
          strokeColor: '#fff',
          strokeWeight: 3,
          scale: 10,
        },
        zIndex: 999,
      });

      radiusCircle = new google.maps.Circle({
        map,
        center: userLocation,
        radius: 8047,
        fillColor: '#D85A30',
        fillOpacity: 0.06,
        strokeColor: '#D85A30',
        strokeOpacity: 0.3,
        strokeWeight: 1.5,
      });

      map.setCenter(userLocation);
      map.setZoom(13);

      const nearby = allPlaces.filter(r => {
        if (!r.latitude) return false;
        return getDistance(userLocation.lat, userLocation.lng, r.latitude, r.longitude) <= 5;
      });

      renderMarkers(nearby);
      renderList(allPlaces);
      document.getElementById('radius-label').classList.add('visible');

    }, () => {
      btn.textContent = '📍 Near me';
      btn.classList.remove('locating');
      alert('Could not get your location. Please allow location access and try again.');
    });
  }

  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 3958.8;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
              Math.sin(dLng/2) * Math.sin(dLng/2);
    return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
  }
</script>

<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAgV7K00A0_7KCSimsDEfS2y4aJ61nE_Jw&callback=initMap">
</script>

</body>
</html>
