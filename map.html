<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map — Find Food Near You — 559eats</title>
  <meta name="description" content="Find food trucks and restaurants near you on the 559eats map." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #E8512A; --orange-dark: #c73e18; --orange-light: #f9ede8;
      --cream: #faf7f4; --dark: #1a1310; --text: #2d2420; --muted: #7a6e6a;
      --border: #e8e0da; --white: #fff;
    }
    body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--cream); overflow: hidden; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(250,247,244,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); height: 64px;
      display: flex; align-items: center; padding: 0 24px; gap: 32px;
    }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 800; color: var(--orange); text-decoration: none; }
    .nav-links { display: flex; gap: 24px; list-style: none; margin-left: auto; }
    .nav-links a { text-decoration: none; color: var(--muted); font-size: .9rem; font-weight: 500; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--orange); }
    .nav-cta { background: var(--orange); color: #fff !important; padding: 8px 18px; border-radius: 999px; font-weight: 600 !important; }
    .nav-cta:hover { background: var(--orange-dark) !important; }
    .map-layout { display: flex; height: 100vh; padding-top: 64px; }
    .map-sidebar {
      width: 360px; flex-shrink: 0; background: var(--white);
      border-right: 1px solid var(--border); overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sidebar-header h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 12px; }
    .search-wrap { display: flex; border: 1.5px solid var(--border); border-radius: 999px; overflow: hidden; }
    .search-wrap input { flex: 1; border: none; outline: none; padding: 10px 16px; font-size: .9rem; font-family: inherit; color: var(--text); background: transparent; }
    .search-wrap button { background: var(--orange); color: #fff; border: none; padding: 10px 18px; cursor: pointer; font-size: .88rem; font-weight: 600; transition: background .2s; }
    .search-wrap button:hover { background: var(--orange-dark); }
    .filter-row { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .fpill { padding: 5px 14px; border-radius: 999px; font-size: .78rem; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: transparent; color: var(--muted); transition: all .15s; white-space: nowrap; }
    .fpill:hover { border-color: var(--orange); color: var(--orange); }
    .fpill.active { background: var(--orange); color: #fff; border-color: var(--orange); }
    .list-wrap { flex: 1; overflow-y: auto; padding: 10px; }
    .map-card { display: flex; gap: 12px; padding: 12px; border-radius: 10px; cursor: pointer; transition: background .15s; border: 1.5px solid transparent; text-decoration: none; color: inherit; margin-bottom: 6px; }
    .map-card:hover { background: var(--cream); border-color: var(--border); }
    .map-card.active { background: var(--orange-light); border-color: var(--orange); }
    .map-card-img { width: 56px; height: 56px; border-radius: 8px; flex-shrink: 0; background: var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--muted); }
    .map-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .map-card-body { flex: 1; min-width: 0; }
    .map-card-name { font-weight: 600; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .map-card-meta { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .map-card-tag { display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 600; background: var(--orange-light); color: var(--orange); }
    .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: .9rem; }
    #map { flex: 1; z-index: 1; }
    .leaflet-popup-content-wrapper { border-radius: 12px !important; box-shadow: 0 8px 32px rgba(0,0,0,.14) !important; padding: 0 !important; overflow: hidden; }
    .leaflet-popup-content { margin: 0 !important; }
    .popup-inner { padding: 14px 16px; min-width: 200px; }
    .popup-name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .popup-meta { font-size: .78rem; color: var(--muted); margin-bottom: 10px; }
    .popup-btn { display: block; text-align: center; background: var(--orange); color: #fff; text-decoration: none; padding: 7px 14px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
    .popup-btn:hover { background: var(--orange-dark); }
    @media (max-width: 640px) {
      .map-sidebar { width: 100%; position: absolute; bottom: 0; left: 0; right: 0; height: 45vh; z-index: 500; border-right: none; border-top: 1px solid var(--border); }
      #map { height: 55vh; }
      .map-layout { flex-direction: column; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">559eats</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/browse.html">Browse</a></li>
      <li><a href="/map.html" class="active">Map</a></li>
      <li><a href="/about.html">About</a></li>
      <li><a href="/apply.html" class="nav-cta">List Your Spot</a></li>
    </ul>
  </nav>
  <div class="map-layout">
    <div class="map-sidebar">
      <div class="sidebar-header">
        <h2>Find Food Near You</h2>
        <div class="search-wrap">
          <input type="text" id="mapSearch" placeholder="Search name or neighborhood..." />
          <button onclick="applyFilters()">Go</button>
        </div>
      </div>
      <div class="filter-row" id="filterRow">
        <button class="fpill active" data-filter="all">All</button>
        <button class="fpill" data-filter="truck">Food Trucks</button>
        <button class="fpill" data-filter="Mexican">Mexican</button>
        <button class="fpill" data-filter="BBQ">BBQ</button>
        <button class="fpill" data-filter="Asian">Asian</button>
        <button class="fpill" data-filter="Burgers">Burgers</button>
      </div>
      <div class="list-wrap" id="listWrap">
        <div class="empty-state">Loading locations...</div>
      </div>
    </div>
    <div id="map"></div>
  </div>
  <script>
    const SUPA='https://wlpugteoycouvvnhamnm.supabase.co';
    const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndscHVndGVveWNvdXZ2bmhhbW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzY3MjksImV4cCI6MjA5MTQxMjcyOX0.RndK-tL1KG7Yg23JxtMqRlv5rECd6ppJubwNwoM2d5g';
    const map=L.map('map').setView([36.7468,-119.7726],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(map);
    function makeIcon(truck){return L.divIcon({className:'',html:'<div style="width:28px;height:28px;border-radius:50% 50% 50% 0;background:'+(truck?'#1a1310':'#E8512A')+';transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-30]});}
    let allData=[],markers=[],activeFilter='all';
    function isTruck(r){return r.is_food_truck===true;}
    function cLabel(r){return r.cuisine_type||'';}
    function matchesFilter(r){if(activeFilter==='all')return true;if(activeFilter==='truck')return isTruck(r);return(cLabel(r)||'').toLowerCase().includes(activeFilter.toLowerCase());}
    function matchesSearch(r,q){if(!q)return true;const s=q.toLowerCase();return(r.name||'').toLowerCase().includes(s)||(r.neighborhood||'').toLowerCase().includes(s)||(cLabel(r)||'').toLowerCase().includes(s);}
    function renderList(data){
      const lw=document.getElementById('listWrap');
      if(!data.length){lw.innerHTML='<div class="empty-state">No results found.</div>';return;}
      lw.innerHTML=data.map(r=>{
        const truck=isTruck(r),cuisine=cLabel(r),hood=r.neighborhood||r.location||'';
        const img='';
        const imgEl=img?'<img src="'+img+'" alt="'+r.name+'" loading="lazy" onerror="this.parentElement.innerHTML=''+(truck?'[Truck]':'[Food]')+''">':(truck?'[T]':'[F]');
        const href=r.slug?'/trucks/'+r.slug:(r.id?'restaurant.html?id='+r.id:'#');
        return '<a class="map-card" data-id="'+r.id+'" href="'+href+'"><div class="map-card-img">'+imgEl+'</div><div class="map-card-body"><div class="map-card-name">'+r.name+'</div><div class="map-card-meta">'+[cuisine,hood].filter(Boolean).join(' &middot; ')+'</div><span class="map-card-tag">'+(truck?'Food Truck':'Restaurant')+'</span></div></a>';
      }).join('');
      lw.querySelectorAll('.map-card').forEach(card=>{
        card.addEventListener('click',e=>{
          e.preventDefault();
          const r=allData.find(x=>x.id===card.dataset.id);
          if(r&&r.latitude&&r.longitude){map.flyTo([r.latitude,r.longitude],15,{duration:0.8});const mk=markers.find(m=>m._rid===r.id);if(mk)mk.openPopup();}
          document.querySelectorAll('.map-card').forEach(c=>c.classList.remove('active'));
          card.classList.add('active');
        });
      });
    }
    function renderMarkers(data){
      markers.forEach(m=>map.removeLayer(m));markers=[];
      data.forEach(r=>{
        if(!r.latitude||!r.longitude)return;
        const truck=isTruck(r),cuisine=cLabel(r),hood=r.neighborhood||'';
        const href=r.slug?'/trucks/'+r.slug:(r.id?'restaurant.html?id='+r.id:'#');
        const mk=L.marker([r.latitude,r.longitude],{icon:makeIcon(truck)});
        mk._rid=r.id;
        mk.bindPopup('<div class="popup-inner"><div class="popup-name">'+r.name+'</div><div class="popup-meta">'+[cuisine,hood].filter(Boolean).join(' &middot; ')+'</div><a class="popup-btn" href="'+href+'">View Details</a></div>');
        mk.on('click',()=>{
          document.querySelectorAll('.map-card').forEach(c=>c.classList.remove('active'));
          const card=document.querySelector('.map-card[data-id="'+r.id+'"]');
          if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
        });
        mk.addTo(map);markers.push(mk);
      });
    }
    function applyFilters(){
      const q=document.getElementById('mapSearch').value.trim();
      const filtered=allData.filter(r=>matchesFilter(r)&&matchesSearch(r,q));
      renderList(filtered);renderMarkers(filtered);
    }
    document.getElementById('mapSearch').addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters();});
    document.getElementById('filterRow').addEventListener('click',e=>{
      const btn=e.target.closest('.fpill');if(!btn)return;
      document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');activeFilter=btn.dataset.filter;applyFilters();
    });
    async function init(){
      try{
        const res=await fetch(SUPA+'/rest/v1/restaurants?select=id,name,cuisine_type,neighborhood,latitude,longitude,is_food_truck,is_active&is_active=eq.true&order=name.asc&limit=500',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
        allData=await res.json();
        applyFilters();
        const pts=allData.filter(r=>r.latitude&&r.longitude).map(r=>[r.latitude,r.longitude]);
        if(pts.length)map.fitBounds(pts,{padding:[40,40],maxZoom:13});
      }catch(e){document.getElementById('listWrap').innerHTML='<div class="empty-state">Could not load locations.</div>';}
    }
    init();
  </script>
</body>
</html>
