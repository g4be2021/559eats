<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map &mdash; Find Food Near You &mdash; 559eats</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--orange:#E8512A;--orange-dark:#c73e18;--orange-light:#f9ede8;--cream:#faf7f4;--dark:#1a1310;--text:#2d2420;--muted:#7a6e6a;--border:#e8e0da;--white:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}html{scroll-behavior:smooth}body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:64px;background:rgba(250,247,244,.85);backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(232,224,218,.6);transition:background .3s,box-shadow .3s}nav.scrolled{background:rgba(250,247,244,.97);box-shadow:0 2px 20px rgba(0,0,0,.08)}.nav-logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:800;color:var(--orange);text-decoration:none}.nav-links{display:flex;align-items:center;gap:8px}.nav-links a{font-size:.9rem;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px;transition:color .2s,background .2s}.nav-links a:hover{color:var(--text);background:var(--border)}.nav-cta{background:var(--orange)!important;color:var(--white)!important;padding:8px 20px!important;border-radius:999px!important;font-weight:600!important}.nav-cta:hover{background:var(--orange-dark)!important}.page-hero{padding:120px 24px 60px;text-align:center;background:linear-gradient(160deg,#2d1a14 0%,#4a2218 60%,#E8512A 100%)}.page-hero .eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:12px;display:block}.page-hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;color:#fff;margin-bottom:16px;line-height:1.1}.page-hero p{font-size:1.05rem;color:rgba(255,255,255,.8);max-width:520px;margin:0 auto}.container{max-width:1100px;margin:0 auto;padding:60px 24px}footer{background:var(--dark);color:rgba(255,255,255,.55);text-align:center;padding:36px 24px;font-size:.875rem}footer a{color:rgba(255,255,255,.75);text-decoration:none}footer a:hover{color:var(--orange)}.footer-links{display:flex;gap:24px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}@media(max-width:768px){nav{padding:0 16px}.nav-links a:not(.nav-cta){display:none}}
  body{overflow:hidden}
  .map-layout{display:flex;height:100vh;padding-top:64px}
  .map-sidebar{width:360px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
  .map-sidebar-header{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0}
  .map-sidebar-header h2{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;margin-bottom:12px}
  .map-search-wrap{display:flex;border:1.5px solid var(--border);border-radius:999px;overflow:hidden}
  .map-search-wrap input{flex:1;border:none;outline:none;padding:10px 16px;font-size:.9rem;font-family:inherit;color:var(--text)}
  .map-search-wrap button{background:var(--orange);color:#fff;border:none;padding:10px 18px;cursor:pointer;font-size:.88rem;font-weight:600;transition:background .2s}
  .map-search-wrap button:hover{background:var(--orange-dark)}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--border)}
  .m-pill{padding:5px 12px;border-radius:999px;border:1.5px solid var(--border);background:var(--white);font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
  .m-pill.active,.m-pill:hover{background:var(--orange);border-color:var(--orange);color:#fff}
  .map-list{flex:1;overflow-y:auto;padding:12px}
  .map-item{display:flex;gap:12px;padding:12px;border-radius:12px;cursor:pointer;transition:background .15s;text-decoration:none;color:inherit;margin-bottom:4px}
  .map-item:hover{background:var(--cream)}
  .map-item-img{width:52px;height:52px;border-radius:10px;background:var(--orange-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden}
  .map-item-img img{width:100%;height:100%;object-fit:cover}
  .map-item-name{font-weight:700;font-size:.9rem;margin-bottom:2px}
  .map-item-meta{font-size:.78rem;color:var(--muted)}
  .map-frame{flex:1;position:relative;background:#e8e0da}
  .map-frame iframe{width:100%;height:100%;border:none}
  .map-cta-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(42,19,10,.85),rgba(72,32,18,.75));flex-direction:column;gap:16px;text-align:center;padding:24px}
  .map-cta-overlay h3{font-family:'Playfair Display',serif;font-size:1.75rem;color:#fff;font-weight:700}
  .map-cta-overlay p{color:rgba(255,255,255,.8);max-width:360px}
  .map-cta-overlay .location-btn{background:var(--orange);color:#fff;border:none;padding:14px 28px;border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer;transition:background .2s,transform .15s}
  .map-cta-overlay .location-btn:hover{background:var(--orange-dark);transform:translateY(-1px)}
  @media(max-width:768px){.map-sidebar{width:100%;height:40vh;border-right:none;border-bottom:1px solid var(--border)}.map-layout{flex-direction:column}.map-frame{flex:1}}
</style></head>
<body>
<nav id="nav"><a href="/" class="nav-logo">559eats</a><div class="nav-links"><a href="/browse.html">Browse</a><a href="/map.html">Map</a><a href="/catering.html">Catering</a><a href="/food-trucks.html">Food trucks</a><a href="/apply.html" class="nav-cta">List your spot</a></div></nav>
<div class="map-layout">
  <div class="map-sidebar">
    <div class="map-sidebar-header">
      <h2>&#128205; Find food near you</h2>
      <div class="map-search-wrap">
        <input type="text" id="mapSearch" placeholder="Search restaurants&hellip;" oninput="filterList(this.value)">
        <button onclick="filterList(document.getElementById('mapSearch').value)">Go</button>
      </div>
    </div>
    <div class="pill-row" id="mapPills">
      <span class="m-pill active" onclick="filterCat('')">All</span>
      <span class="m-pill" onclick="filterCat('Mexican')">&#127790; Mexican</span>
      <span class="m-pill" onclick="filterCat('BBQ')">&#128293; BBQ</span>
      <span class="m-pill" onclick="filterCat('Asian')">&#127836; Asian</span>
      <span class="m-pill" onclick="filterCat('Burgers')">&#127828; Burgers</span>
      <span class="m-pill" onclick="filterCat('truck')">&#128666; Trucks</span>
    </div>
    <div class="map-list" id="mapList"><div style="padding:20px;color:var(--muted);font-size:.9rem">Loading&hellip;</div></div>
  </div>
  <div class="map-frame">
    <div class="map-cta-overlay" id="mapOverlay">
      <h3>&#128205; Explore the 559</h3>
      <p>Find restaurants and food trucks near your current location or browse the full map.</p>
      <button class="location-btn" onclick="loadMap()">&#127968; Use my location</button>
    </div>
    <iframe id="mapIframe" style="display:none" allowfullscreen loading="lazy"></iframe>
  </div>
</div>
<script>
window.addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',scrollY>40),{passive:true});
const SUPA='https://wlpugteoycouvvnhamnm.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndscHVndGVveWNvdXZ2bmhhbW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjI2NDE4NjYsImV4cCI6MjAzODIxNzg2Nn0.Hm1fKAYvNiWHxTl3nNR0-ZhXsJjMaQ8TnLaREOv7Yio';
let allData=[], currentFilter='';
(async()=>{
  try{
    const r=await fetch(SUPA+'/rest/v1/restaurants?select=*&order=name.asc&limit=60',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    allData=await r.json();
  }catch{allData=[];}
  renderList(allData);
})();
function renderList(data){
  const el=document.getElementById('mapList');
  if(!data.length){el.innerHTML='<div style="padding:20px;color:var(--muted)">No results found.</div>';return;}
  el.innerHTML=data.map(r=>{
    const cuisine=r.cuisine_type||r.cuisine||r.category||'';
    const isTruck=(r.type||r.category||'').toLowerCase().includes('truck');
    const img=r.image_url?'<img src="'+r.image_url+'" alt="">':'<span>'+(isTruck?'&#128666;':'&#127860;')+'</span>';
    return '<a href="'+(r.slug?'/trucks/'+r.slug:'#')+'" class="map-item"><div class="map-item-img">'+img+'</div><div><div class="map-item-name">'+r.name+'</div><div class="map-item-meta">'+cuisine+(r.neighborhood?' &middot; '+r.neighborhood:'')+'</div></div></a>';
  }).join('');
}
function filterList(q){
  const low=q.toLowerCase();
  renderList(allData.filter(r=>(r.name||'').toLowerCase().includes(low)||(r.cuisine_type||r.cuisine||'').toLowerCase().includes(low)||(r.neighborhood||r.area||'').toLowerCase().includes(low)));
}
function filterCat(cat){
  document.querySelectorAll('.m-pill').forEach(p=>p.classList.remove('active'));
  event.target.classList.add('active');
  currentFilter=cat;
  if(!cat){renderList(allData);return;}
  const low=cat.toLowerCase();
  renderList(allData.filter(r=>(r.cuisine_type||r.cuisine||r.type||r.category||'').toLowerCase().includes(low)));
}
function loadMap(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      const {latitude:lat,longitude:lng}=pos.coords;
      const iframe=document.getElementById('mapIframe');
      iframe.src='https://maps.google.com/maps?q=restaurants+near+Fresno+CA&output=embed&ll='+lat+','+lng+'&z=13';
      iframe.style.display='block';
      document.getElementById('mapOverlay').style.display='none';
    },()=>fallbackMap());
  } else { fallbackMap(); }
}
function fallbackMap(){
  const iframe=document.getElementById('mapIframe');
  iframe.src='https://maps.google.com/maps?q=restaurants+Fresno+CA&output=embed&z=12';
  iframe.style.display='block';
  document.getElementById('mapOverlay').style.display='none';
}
</script></body></html>
