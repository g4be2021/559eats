<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>559eats · Map</title>
  <meta name="description" content="Find restaurants and food trucks near you in Fresno and the 559." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --coral: #D85A30; --coral-dark: #4A1B0C; --coral-light: #FAECE7;
      --coral-mid: #F0997B; --cream: #FBF7F2; --ink: #1A1208;
      --ink-muted: #6B5C4E; --ink-faint: #C2B5A8; --white: #FFFFFF;
      --card-border: rgba(26,18,8,0.08); --radius: 14px; --radius-sm: 8px;
      --panel-width: 360px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); overflow: hidden; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(251,247,242,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 900; color: var(--coral); letter-spacing: -0.5px; text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 20px; }
    .nav-links a { font-size: 13px; font-weight: 500; color: var(--ink-muted); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a.active { color: var(--coral); }
    .nav-cta { background: var(--coral); color: var(--white) !important; padding: 7px 16px; border-radius: 20px; }
    .nav-cta:hover { background: var(--coral-dark) !important; }

    .app { display: flex; height: 100vh; padding-top: 60px; }

    .panel { width: var(--panel-width); flex-shrink: 0; background: var(--cream); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--card-border); flex-shrink: 0; }
    .panel-search { display: flex; gap: 8px; margin-bottom: 10px; }
    .panel-search input { flex: 1; padding: 9px 14px; border: 1px solid var(--card-border); border-radius: 25px; outline: none; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--white); color: var(--ink); transition: border-color 0.2s; }
    .panel-search input:focus { border-color: var(--coral); }
    .near-me-btn { padding: 9px 14px; border-radius: 25px; background: var(--coral); color: var(--white); border: none; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
    .near-me-btn:hover { background: var(--coral-dark); }
    .near-me-btn.locating { background: var(--ink-muted); cursor: wait; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { padding: 4px 12px; border-radius: 15px; font-size: 12px; border: 1px solid var(--card-border); background: var(--white); color: var(--ink-muted); cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
    .chip:hover { border-color: var(--coral); color: var(--coral); }
    .chip.active { background: var(--coral); color: var(--white); border-color: var(--coral); }

    .panel-results { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .results-count { font-size: 11px; color: var(--ink-muted); padding: 4px 4px 10px; font-weight: 500; }

    .r-item { border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s; border: 1px solid transparent; margin-bottom: 6px; overflow: hidden; }
    .r-item-top { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
    .r-item:hover { background: var(--white); border-color: var(--card-border); }
    .r-item.active { background: var(--white); border-color: var(--coral); }
    .r-item-icon { width: 48px; height: 48px; border-radius: 10px; background: var(--coral-light); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .r-item-icon.truck { background: #FAEEDA; }
    .r-item-info { flex: 1; min-width: 0; }
    .r-item-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-item-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 4px; }
    .r-item-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 10px; padding: 2px 7px; border-radius: 8px; background: #F1EFE8; color: var(--ink-muted); }
    .badge.truck-badge { background: #FAEEDA; color: #633806; }
    .distance { font-size: 11px; color: var(--coral); font-weight: 500; }

    .r-item-detail { display: none; padding: 0 12px 14px 12px; border-top: 1px solid var(--card-border); }
    .r-item.active .r-item-detail { display: block; }
    .detail-row { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--ink-muted); margin-bottom: 7px; margin-top: 10px; }
    .detail-row:first-child { margin-top: 12px; }
    .detail-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
    .detail-text { line-height: 1.4; }
    .detail-text a { color: var(--coral); text-decoration: none; }
    .detail-actions { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
    .detail-btn { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.15s; border: none; }
    .detail-btn.primary { background: var(--coral); color: var(--white); }
    .detail-btn.primary:hover { background: var(--coral-dark); }
    .detail-btn.secondary { background: var(--white); color: var(--ink-muted); border: 1px solid var(--card-border); }
    .detail-btn.secondary:hover { border-color: var(--coral); color: var(--coral); }
    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--ink-muted); font-size: 13px; }

    .map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* Desktop floating card */
    .map-info-card {
      position: absolute; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: var(--white); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 16px 18px;
      min-width: 260px; max-width: 320px;
      z-index: 10; box-shadow: 0 4px 20px rgba(26,18,8,0.12);
      display: none;
    }
    .map-info-card.visible { display: block; }
    .drawer-handle { display: none; }
    .map-info-card-close { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 16px; cursor: pointer; color: var(--ink-muted); line-height: 1; }
    .map-info-name { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; margin-bottom: 3px; padding-right: 20px; }
    .map-info-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 10px; }
    .map-info-row { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; color: var(--ink-muted); margin-bottom: 6px; }
    .map-info-row a { color: var(--coral); text-decoration: none; }
    .map-info-actions { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
    .map-info-btn { padding: 9px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.15s; border: none; }
    .map-info-btn.primary { background: var(--coral); color: var(--white); flex: 1; text-align: center; }
    .map-info-btn.primary:hover { background: var(--coral-dark); }
    .map-info-btn.secondary { background: var(--cream); color: var(--ink-muted); border: 1px solid var(--card-border); }
    .map-info-btn.secondary:hover { border-color: var(--coral); color: var(--coral); }

    .radius-label { position: absolute; bottom: 16px; right: 16px; background: var(--white); border: 1px solid var(--card-border); border-radius: 25px; padding: 6px 14px; font-size: 12px; color: var(--ink-muted); z-index: 5; display: none; }
    .radius-label.visible { display: block; }

    .skeleton { background: linear-gradient(90deg,#f0ebe4 25%,#e8e1d8 50%,#f0ebe4 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:var(--radius-sm); }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* Mobile bottom drawer */
    @media (max-width: 700px) {
      .app { flex-direction: column; }
      .panel { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--card-border); }
      .map-container { height: 60vh; }
      .nav-links a:not(.nav-cta) { display: none; }

      .map-info-card {
        display: block !important;
        position: absolute;
        bottom: 0; left: 0; right: 0;
        transform: translateY(110%);
        max-width: 100%; min-width: 100%;
        border-radius: var(--radius) var(--radius) 0 0;
        padding: 0 20px 44px;
        max-height: 78vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        box-shadow: 0 -8px 32px rgba(26,18,8,0.18);
        will-change: transform;
        z-index: 20;
        /* transition applied via JS so drag feels instant */
      }
      .map-info-card.animating {
        transition: transform 0.38s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      .map-info-card.visible {
        transform: translateY(0) !important;
      }
      .map-info-card-close { display: none; }

      /* Drag zone — full width strip at top of drawer */
      .drawer-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px 0 10px;
        cursor: grab;
        touch-action: pan-y;
        flex-shrink: 0;
      }
      .drawer-handle::after {
        content: '';
        display: block;
        width: 40px; height: 5px;
        background: var(--ink-faint);
        border-radius: 3px;
      }
      .map-info-name { font-size: 19px; padding-right: 0; }
      .map-info-meta { font-size: 13px; margin-bottom: 14px; }
      .map-info-row { font-size: 14px; margin-bottom: 10px; }
      .map-info-actions { gap: 10px; margin-top: 20px; flex-direction: column; }
      .map-info-btn { padding: 15px 20px; font-size: 15px; border-radius: 25px; text-align: center; width: 100%; }
      .map-info-btn.secondary { background: var(--white); border: 1.5px solid var(--card-border); }
      .radius-label { top: 8px; right: 8px; bottom: auto; z-index: 5; }
    }
  </style>

<div class="app">
  <div class="panel">
    <div class="panel-header">

        <div class="r-item"><div class="r-item-top"><div class="r-item-icon skeleton" style="font-size:0"></div><div class="r-item-info"><div class="skeleton" style="height:14px;width:70%;margin-bottom:6px"></div><div class="skeleton" style="height:11px;width:50%"></div></div></div></div>
        <div class="r-item"><div class="r-item-top"><div class="r-item-icon skeleton" style="font-size:0"></div><div class="r-item-info"><div class="skeleton" style="height:14px;width:70%;margin-bottom:6px"></div><div class="skeleton" style="height:11px;width:50%"></div></div></div></div>
      </div>

  <div class="map-container">
    <div id="map"></div>
    <div class="map-info-card" id="map-info-card">

      <button class="map-info-card-close" onclick="closeInfoCard()">✕</button>

<script>
  const SUPABASE_URL = 'https://wlpugteoycouvvnhamnm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndscHVndGVveWNvdXZ2bmhhbW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzY3MjksImV4cCI6MjA5MTQxMjcyOX0.RndK-tL1KG7Yg23JxtMqRlv5rECd6ppJubwNwoM2d5g';
  const MAPS_KEY = 'AIzaSyAgV7K00A0_7KCSimsDEfS2y4aJ61nE_Jw';

  const ICONS = {
    'Mexican':'🌮','Vietnamese':'🍜','BBQ':'🍖','Pizza':'🍕',
    'Hawaiian Fusion':'🍱','Asian Street Food':'🥡',
    'Mexican Street Food':'🌯','default':'🍽️'
  };
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  let map, userMarker, radiusCircle;
  let allPlaces = [];
  let allHours = {};
  let markers = [];
  let activeFilter = '';
  let userLocation = null;
  let activeItemId = null;

  // ── Drawer swipe-to-dismiss ──
  function initDrawer() {
    const card = document.getElementById('map-info-card');
    let touchStartY = 0;
    let lastY = 0;
    let lastTime = 0;
    let velocity = 0;
    let dragging = false;
    let currentDragY = 0;

    function setTransform(y, animated) {
      if (animated) {
        card.style.transition = 'transform 0.42s cubic-bezier(0.34, 1.4, 0.64, 1)';
      } else {
        card.style.transition = 'none';
      }
      card.style.transform = y === 0 ? '' : `translateY(${y}px)`;
    }

    card.addEventListener('touchstart', e => {
      if (!card.classList.contains('visible')) return;
      touchStartY = e.touches[0].clientY;
      lastY = touchStartY;
      lastTime = Date.now();
      velocity = 0;
      dragging = false;
      currentDragY = 0;
    }, { passive: true });

    card.addEventListener('touchmove', e => {
      if (!card.classList.contains('visible')) return;
      const dy = e.touches[0].clientY - touchStartY;

      // Only drag down when scrolled to top
      if (dy > 0 && card.scrollTop <= 0) {
        dragging = true;
        currentDragY = dy;

        // Track velocity
        const now = Date.now();
        const dt = now - lastTime;
        if (dt > 0) velocity = (e.touches[0].clientY - lastY) / dt;
        lastY = e.touches[0].clientY;
        lastTime = now;

        // Move card instantly with finger — no transition
        setTransform(dy, false);
        e.preventDefault();
      }
    }, { passive: false });

    card.addEventListener('touchend', () => {
      if (!dragging) return;

      // Dismiss if dragged far enough OR flicked fast
      const shouldDismiss = currentDragY > 80 || velocity > 0.5;

      if (shouldDismiss) {
        // Animate out fast
        card.style.transition = 'transform 0.28s cubic-bezier(0.4, 0, 0.6, 1)';
        card.style.transform = 'translateY(110%)';
        setTimeout(() => {
          card.classList.remove('visible', 'animating');
          card.style.transform = '';
          card.style.transition = '';
          markers.forEach(m => m.setIcon(makeMarkerIcon(m._place.is_food_truck, false)));
          activeItemId = null;
          document.querySelectorAll('.r-item').forEach(el => el.classList.remove('active'));
        }, 280);
      } else {
        // Spring back with bounce
        card.style.transition = 'transform 0.42s cubic-bezier(0.34, 1.4, 0.64, 1)';
        card.style.transform = 'translateY(0)';
        setTimeout(() => {
          card.style.transform = '';
          card.style.transition = '';
        }, 420);
      }

      dragging = false;
      currentDragY = 0;
      velocity = 0;
    });
  }

  async function fetchPlaces() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/restaurants?status=eq.approved&is_active=eq.true&order=name`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    return res.json();
  }

  async function fetchHours(restaurantId) {
    if (allHours[restaurantId]) return allHours[restaurantId];
    const res = await fetch(`${SUPABASE_URL}/rest/v1/hours?restaurant_id=eq.${restaurantId}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    const hoursMap = {};
    (data || []).forEach(h => hoursMap[h.day_of_week] = h);
    allHours[restaurantId] = hoursMap;
    return hoursMap;
  }

  function getTodayHours(hoursMap) {
    const today = DAYS[new Date().getDay()];
    const h = hoursMap[today];
    if (!h) return null;
    if (h.is_closed) return { day: today, closed: true };
    return { day: today, open: h.open_time, close: h.close_time, closed: false };
  }

  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 36.7783, lng: -119.7945 },
      zoom: 12,
      styles: [
        { featureType:'poi', elementType:'labels', stylers:[{visibility:'off'}] },
        { featureType:'transit', stylers:[{visibility:'off'}] },
        { featureType:'road', elementType:'geometry', stylers:[{color:'#f5f0ea'}] },
        { featureType:'road.arterial', elementType:'geometry', stylers:[{color:'#ede7df'}] },
        { featureType:'road.highway', elementType:'geometry', stylers:[{color:'#e5ddd4'}] },
        { featureType:'water', elementType:'geometry', stylers:[{color:'#c9e0f0'}] },
        { featureType:'landscape', elementType:'geometry', stylers:[{color:'#fbf7f2'}] },
        { featureType:'administrative', elementType:'geometry.stroke', stylers:[{color:'#d4c9bc'}] }
      ],
      mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
      zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER }
    });

    map.addListener('click', () => closeInfoCard());
    fetchPlaces().then(places => {
      allPlaces = places;
      renderMarkers(places);
      renderList(places);
    });
    initDrawer();
  }

  function makeMarkerIcon(isTruck, isActive) {
    const color = isActive ? '#D85A30' : (isTruck ? '#BA7517' : '#4A1B0C');
    return {
      path: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z',
      fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2,
      scale: isActive ? 1.4 : 1.1, anchor: new google.maps.Point(12, 22),
    };
  }

  function renderMarkers(places) {
    markers.forEach(m => m.setMap(null));
    markers = [];
    places.forEach(place => {
      if (!place.latitude || !place.longitude) return;
      const marker = new google.maps.Marker({
        position: { lat: place.latitude, lng: place.longitude },
        map, title: place.name,
        icon: makeMarkerIcon(place.is_food_truck, false),
        animation: google.maps.Animation.DROP,
      });
      marker.addListener('click', () => selectPlace(place, marker));
      markers.push(marker);
      marker._place = place;
    });
  }

  async function selectPlace(place, marker) {
    markers.forEach(m => m.setIcon(makeMarkerIcon(m._place.is_food_truck, false)));
    marker.setIcon(makeMarkerIcon(place.is_food_truck, true));
    marker.setAnimation(google.maps.Animation.BOUNCE);
    setTimeout(() => marker.setAnimation(null), 700);
    map.panTo({ lat: place.latitude, lng: place.longitude });

    activeItemId = place.id;
    document.querySelectorAll('.r-item').forEach(el => el.classList.toggle('active', el.dataset.id === place.id));
    const activeEl = document.querySelector(`.r-item[data-id="${place.id}"]`);
    if (activeEl) {
      activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      await expandListItem(place.id);
    }
    showInfoCard(place);
  }

  async function showInfoCard(place) {
    const card = document.getElementById('map-info-card');
    document.getElementById('info-name').textContent = place.name;
    document.getElementById('info-meta').textContent =
      `${place.cuisine_type || ''}${place.neighborhood ? ' · ' + place.neighborhood : ''}${place.is_food_truck ? ' · 🚚 Food truck' : ''}`;

    const hoursMap = await fetchHours(place.id);
    const today = getTodayHours(hoursMap);
    let rows = '';
    if (place.address) rows += `<div class="map-info-row">📍 <span>${place.address}</span></div>`;
    if (place.phone) rows += `<div class="map-info-row">📞 <a href="tel:${place.phone}">${place.phone}</a></div>`;
    if (today) rows += `<div class="map-info-row">🕐 <span>${today.closed ? '<strong style="color:#791F1F">Closed today</strong>' : `<strong>Today:</strong> ${today.open} – ${today.close}`}</span></div>`;
    document.getElementById('info-rows').innerHTML = rows;

    let actions = `<a href="restaurant.html?id=${place.id}" class="map-info-btn primary">View listing →</a>`;
    if (place.phone) actions += `<a href="tel:${place.phone}" class="map-info-btn secondary">📞 Call</a>`;
    actions += `<a href="catering.html?id=${place.id}" class="map-info-btn secondary">🍽️ Book catering</a>`;
    document.getElementById('info-actions').innerHTML = actions;

    // Snap to hidden, force reflow, then spring up
    card.style.transition = 'none';
    card.style.transform = 'translateY(110%)';
    card.classList.add('visible');
    card.getBoundingClientRect();
    card.style.transition = 'transform 0.42s cubic-bezier(0.34, 1.4, 0.64, 1)';
    card.style.transform = 'translateY(0)';
  }

  function closeInfoCard() {
    const card = document.getElementById('map-info-card');
    card.style.transition = 'transform 0.28s cubic-bezier(0.4, 0, 0.6, 1)';
    card.style.transform = 'translateY(110%)';
    setTimeout(() => {
      card.classList.remove('visible', 'animating');
      card.style.transform = '';
      card.style.transition = '';
    }, 280);
    markers.forEach(m => m.setIcon(makeMarkerIcon(m._place.is_food_truck, false)));
    activeItemId = null;
    document.querySelectorAll('.r-item').forEach(el => el.classList.remove('active'));
  }

  function renderList(places) {
    const container = document.getElementById('list-container');
    const countEl = document.getElementById('results-count');
    const filtered = applyFilters(places);
    countEl.textContent = `${filtered.length} spot${filtered.length !== 1 ? 's' : ''} found`;

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state">No spots found.<br>Try a different filter.</div>';
      return;
    }

    container.innerHTML = filtered.map(r => {
      const dist = userLocation && r.latitude
        ? `<span class="distance">${getDistance(userLocation.lat, userLocation.lng, r.latitude, r.longitude)} mi</span>` : '';
      return `
        <div class="r-item ${r.id === activeItemId ? 'active' : ''}" data-id="${r.id}">
          <div class="r-item-top" onclick="clickListItem('${r.id}')">
            <div class="r-item-icon ${r.is_food_truck ? 'truck' : ''}">${ICONS[r.cuisine_type] || ICONS.default}</div>
            <div class="r-item-info">
              <div class="r-item-name">${r.name}</div>
              <div class="r-item-meta">${r.cuisine_type || ''}${r.neighborhood ? ' · ' + r.neighborhood : ''}</div>
              <div class="r-item-footer">
                ${r.is_food_truck ? '<span class="badge truck-badge">🚚 Food truck</span>' : ''}
                ${dist}
              </div>
            </div>
          </div>
          <div class="r-item-detail" id="detail-${r.id}">
            <div style="font-size:12px;color:var(--ink-faint);padding:8px 0;">Loading...</div>
          </div>
        </div>`;
    }).join('');
  }

  async function expandListItem(id) {
    const detailEl = document.getElementById(`detail-${id}`);
    if (!detailEl) return;
    const place = allPlaces.find(p => p.id === id);
    if (!place) return;

    const hoursMap = await fetchHours(id);
    const today = getTodayHours(hoursMap);
    let html = '';
    if (place.address) html += `<div class="detail-row"><span class="detail-icon">📍</span><span class="detail-text">${place.address}</span></div>`;
    if (place.phone) html += `<div class="detail-row"><span class="detail-icon">📞</span><span class="detail-text"><a href="tel:${place.phone}">${place.phone}</a></span></div>`;
    if (place.website) html += `<div class="detail-row"><span class="detail-icon">🌐</span><span class="detail-text"><a href="${place.website}" target="_blank">${place.website.replace('https://','').replace('http://','')}</a></span></div>`;
    if (today) html += `<div class="detail-row"><span class="detail-icon">🕐</span><span class="detail-text">${today.closed ? '<strong style="color:#791F1F">Closed today</strong>' : `<strong>Today:</strong> ${today.open} – ${today.close}`}</span></div>`;
    html += `<div class="detail-actions">
      <a href="restaurant.html?id=${place.id}" class="detail-btn primary">View full listing →</a>
      ${place.phone ? `<a href="tel:${place.phone}" class="detail-btn secondary">📞 Call</a>` : ''}
      <a href="catering.html?id=${place.id}" class="detail-btn secondary">🍽️ Catering</a>
    </div>`;
    detailEl.innerHTML = html;
  }

  async function clickListItem(id) {
    const place = allPlaces.find(p => p.id === id);
    if (!place) return;
    const wasActive = activeItemId === id;

    document.querySelectorAll('.r-item').forEach(el => el.classList.remove('active'));
    markers.forEach(m => m.setIcon(makeMarkerIcon(m._place.is_food_truck, false)));
    closeInfoCard();

    if (wasActive) { activeItemId = null; return; }

    activeItemId = id;
    const el = document.querySelector(`.r-item[data-id="${id}"]`);
    if (el) el.classList.add('active');
    await expandListItem(id);

    if (place.latitude && place.longitude) {
      map.panTo({ lat: place.latitude, lng: place.longitude });
      map.setZoom(15);
      const marker = markers.find(m => m._place.id === id);
      if (marker) {
        marker.setIcon(makeMarkerIcon(place.is_food_truck, true));
        marker.setAnimation(google.maps.Animation.BOUNCE);
        setTimeout(() => marker.setAnimation(null), 700);
        showInfoCard(place);
      }
    }
  }

  function applyFilters(places) {
    const q = document.getElementById('map-search').value.toLowerCase().trim();
    return places.filter(r => {
      if (activeFilter === 'restaurant' && r.is_food_truck) return false;
      if (activeFilter === 'truck' && !r.is_food_truck) return false;
      if (activeFilter && activeFilter !== 'restaurant' && activeFilter !== 'truck') {
        if (r.cuisine_type !== activeFilter) return false;
      }
      if (q) return r.name.toLowerCase().includes(q) || (r.cuisine_type||'').toLowerCase().includes(q) || (r.neighborhood||'').toLowerCase().includes(q);
      return true;
    });
  }

  function setFilter(el, val) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    activeFilter = val;
    closeInfoCard();
    renderMarkers(applyFilters(allPlaces));
    renderList(allPlaces);
  }

  function filterList() {
    closeInfoCard();
    renderMarkers(applyFilters(allPlaces));
    renderList(allPlaces);
  }

  function findNearMe() {
    const btn = document.getElementById('near-me-btn');
    if (!navigator.geolocation) { alert('Geolocation not supported.'); return; }
    btn.textContent = 'Locating...';
    btn.classList.add('locating');

    navigator.geolocation.getCurrentPosition(pos => {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      btn.textContent = '📍 Near me';
      btn.classList.remove('locating');

      if (userMarker) userMarker.setMap(null);
      if (radiusCircle) radiusCircle.setMap(null);

      userMarker = new google.maps.Marker({
        position: userLocation, map, title: 'You are here',
        icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: '#4285F4', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3, scale: 10 },
        zIndex: 999,
      });

      radiusCircle = new google.maps.Circle({
        map, center: userLocation, radius: 8047,
        fillColor: '#D85A30', fillOpacity: 0.06,
        strokeColor: '#D85A30', strokeOpacity: 0.3, strokeWeight: 1.5,
      });

      map.setCenter(userLocation);
      map.setZoom(13);
      const nearby = allPlaces.filter(r => r.latitude && getDistance(userLocation.lat, userLocation.lng, r.latitude, r.longitude) <= 5);
      renderMarkers(nearby);
      renderList(allPlaces);
      document.getElementById('radius-label').classList.add('visible');

    }, () => {
      btn.textContent = '📍 Near me';
      btn.classList.remove('locating');
      alert('Could not get your location. Please allow location access and try again.');
    });
  }

  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 3958.8;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return (R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))).toFixed(1);
  }
</script>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAgV7K00A0_7KCSimsDEfS2y4aJ61nE_Jw&callback=initMap"></script>
