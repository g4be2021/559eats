<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>559eats · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --coral: #D85A30; --coral-dark: #4A1B0C; --coral-light: #FAECE7;
      --cream: #FBF7F2; --ink: #1A1208; --ink-muted: #6B5C4E;
      --ink-faint: #C2B5A8; --white: #FFFFFF; --card-border: rgba(26,18,8,0.08);
      --radius: 14px; --radius-sm: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); }
    nav {
      background: var(--coral-dark); padding: 0 2rem; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; color: var(--white); text-decoration: none; }
    .admin-badge { font-size: 11px; background: var(--coral); color: var(--white); padding: 3px 10px; border-radius: 10px; margin-left: 10px; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .pw-input { padding: 7px 12px; border-radius: var(--radius-sm); border: none; font-size: 13px; font-family: 'DM Sans', sans-serif; }
    .pw-btn { padding: 7px 16px; border-radius: var(--radius-sm); background: var(--coral); color: var(--white); border: none; font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 2.5rem 2rem; }
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 2rem; }
    .stat-card { background: var(--white); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 1rem; text-align: center; }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--coral); }
    .stat-label { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; margin-bottom: 1rem; }
    .table-wrap { background: var(--white); border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; margin-bottom: 2rem; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--cream); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--card-border); }
    td { padding: 12px 14px; border-bottom: 1px solid var(--card-border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--cream); }
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 8px; font-weight: 500; }
    .badge-approved { background: #EAF3DE; color: #27500A; }
    .badge-pending { background: #FAEEDA; color: #633806; }
    .badge-suspended { background: #FCEBEB; color: #791F1F; }
    .badge-truck { background: #FAEEDA; color: #633806; }
    .action-btn {
      padding: 5px 12px; border-radius: 15px; font-size: 12px; cursor: pointer;
      border: 1px solid var(--card-border); background: var(--white);
      font-family: 'DM Sans', sans-serif; transition: all 0.15s; margin-right: 4px;
    }
    .action-btn.approve { border-color: #97C459; color: #27500A; }
    .action-btn.approve:hover { background: #EAF3DE; }
    .action-btn.suspend { border-color: #F09595; color: #791F1F; }
    .action-btn.suspend:hover { background: #FCEBEB; }
    .action-btn.delete { border-color: #F09595; color: #791F1F; }
    .action-btn.delete:hover { background: #FCEBEB; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 12px 24px; border-radius: 25px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }
    .locked { display: none; }
    #admin-pw-wall { display: flex; align-items: center; justify-content: center; min-height: 80vh; flex-direction: column; gap: 1rem; text-align: center; }
    #admin-pw-wall h2 { font-family: 'Playfair Display', serif; font-size: 24px; }
    #admin-pw-wall p { font-size: 14px; color: var(--ink-muted); }
    .pw-form { display: flex; gap: 8px; }
    .pw-form input { padding: 10px 14px; border: 1px solid var(--card-border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; }
    .pw-form button { padding: 10px 20px; background: var(--coral); color: var(--white); border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
<nav>
  <div style="display:flex;align-items:center">
    <a href="index.html" class="nav-logo">559eats</a>
    <span class="admin-badge">Admin</span>
  </div>
  <div class="nav-right">
    <span style="font-size:12px;color:rgba(255,255,255,0.6)">Private dashboard</span>
  </div>
</nav>

<div id="admin-pw-wall">
  <div style="font-size:48px">🔐</div>
  <h2>Admin access</h2>
  <p>Enter your admin password to continue.</p>
  <div class="pw-form">
    <input type="password" id="pw-input" placeholder="Admin password" onkeydown="if(event.key==='Enter')checkPw()" />
    <button onclick="checkPw()">Enter</button>
  </div>
  <p id="pw-error" style="color:#D85A30;font-size:13px;display:none">Incorrect password.</p>
</div>

<main id="admin-main" class="locked">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="s-total">—</div><div class="stat-label">Total listings</div></div>
    <div class="stat-card"><div class="stat-num" id="s-approved">—</div><div class="stat-label">Approved</div></div>
    <div class="stat-card"><div class="stat-num" id="s-pending">—</div><div class="stat-label">Pending review</div></div>
    <div class="stat-card"><div class="stat-num" id="s-trucks">—</div><div class="stat-label">Food trucks</div></div>
  </div>

  <div class="section-title">Pending review</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Type</th><th>Neighborhood</th><th>Submitted</th><th>Actions</th></tr></thead>
      <tbody id="pending-body"><tr><td colspan="5" style="text-align:center;color:var(--ink-muted);padding:2rem">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="section-title">All listings</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Cuisine</th><th>Neighborhood</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="all-body"><tr><td colspan="6" style="text-align:center;color:var(--ink-muted);padding:2rem">Loading...</td></tr></tbody>
    </table>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://wlpugteoycouvvnhamnm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndscHVndGVveWNvdXZ2bmhhbW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzY3MjksImV4cCI6MjA5MTQxMjcyOX0.RndK-tL1KG7Yg23JxtMqRlv5rECd6ppJubwNwoM2d5g';

  // CHANGE THIS PASSWORD to something only you know
  const ADMIN_PASSWORD = '0b1806E3EA1959C2.';

  function checkPw() {
    const val = document.getElementById('pw-input').value;
    if (val === ADMIN_PASSWORD) {
      document.getElementById('admin-pw-wall').style.display = 'none';
      document.getElementById('admin-main').classList.remove('locked');
      document.getElementById('admin-main').style.display = 'block';
      loadData();
    } else {
      document.getElementById('pw-error').style.display = 'block';
    }
  }

  async function api(path, method='GET', body=null) {
    const opts = {
      method,
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, opts);
    if (res.status === 204) return null;
    return res.json();
  }

  async function loadData() {
    const all = await api('restaurants?order=created_at.desc');
    if (!all) return;

    document.getElementById('s-total').textContent = all.length;
    document.getElementById('s-approved').textContent = all.filter(r => r.status === 'approved').length;
    document.getElementById('s-pending').textContent = all.filter(r => r.status === 'pending').length;
    document.getElementById('s-trucks').textContent = all.filter(r => r.is_food_truck).length;

    const pending = all.filter(r => r.status === 'pending');
    const pendingBody = document.getElementById('pending-body');
    pendingBody.innerHTML = pending.length === 0
      ? '<tr><td colspan="5" style="text-align:center;color:var(--ink-muted);padding:2rem">No pending listings</td></tr>'
      : pending.map(r => `
        <tr>
          <td><strong>${r.name}</strong></td>
          <td>${r.is_food_truck ? '<span class="badge badge-truck">Food truck</span>' : 'Restaurant'}</td>
          <td>${r.neighborhood || '—'}</td>
          <td style="color:var(--ink-muted)">${new Date(r.created_at).toLocaleDateString()}</td>
          <td>
            <button class="action-btn approve" onclick="setStatus('${r.id}','approved')">✓ Approve</button>
            <button class="action-btn suspend" onclick="setStatus('${r.id}','suspended')">✗ Reject</button>
          </td>
        </tr>`).join('');

    const allBody = document.getElementById('all-body');
    allBody.innerHTML = all.map(r => `
      <tr>
        <td><strong>${r.name}</strong></td>
        <td>${r.cuisine_type || '—'}</td>
        <td>${r.neighborhood || '—'}</td>
        <td>${r.is_food_truck ? '<span class="badge badge-truck">Truck</span>' : 'Restaurant'}</td>
        <td><span class="badge badge-${r.status}">${r.status}</span></td>
        <td>
          ${r.status !== 'approved' ? `<button class="action-btn approve" onclick="setStatus('${r.id}','approved')">Approve</button>` : ''}
          ${r.status !== 'suspended' ? `<button class="action-btn suspend" onclick="setStatus('${r.id}','suspended')">Suspend</button>` : ''}
          <button class="action-btn delete" onclick="deleteRestaurant('${r.id}')">Delete</button>
        </td>
      </tr>`).join('');
  }

  async function setStatus(id, status) {
    const isActive = status === 'approved';
    await api(`restaurants?id=eq.${id}`, 'PATCH', { status, is_active: isActive });
    showToast(`✅ Listing ${status}`);
    loadData();
  }

  async function deleteRestaurant(id) {
    if (!confirm('Are you sure? This cannot be undone.')) return;
    await api(`restaurants?id=eq.${id}`, 'DELETE');
    showToast('Listing deleted.');
    loadData();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
