<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>559eats - SMS Outreach</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #222; }
  #login { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,.1); width: 340px; }
  #login-box h1 { font-size: 22px; margin-bottom: 6px; color: #c0392b; }
  #login-box p { color: #666; font-size: 14px; margin-bottom: 20px; }
  input[type=password] { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
  button { width: 100%; padding: 11px; background: #c0392b; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; }
  button:hover { background: #a93226; }
  #app { display: none; height: 100vh; flex-direction: column; }
  .topbar { background: #fff; padding: 14px 24px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 20px; }
  .topbar h1 { font-size: 18px; color: #c0392b; flex: 1; }
  .stat { font-size: 13px; color: #666; }
  .stat strong { color: #222; }
  .send-btn { padding: 9px 20px; background: #c0392b; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .send-btn:hover { background: #a93226; }
  .send-btn:disabled { background: #ccc; cursor: default; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 320px; border-right: 1px solid #e5e5e5; background: #fff; overflow-y: auto; flex-shrink: 0; }
  .sidebar-header { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #999; }
  .prospect { padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: background .15s; }
  .prospect:hover { background: #fafafa; }
  .prospect.active { background: #fff5f5; border-left: 3px solid #c0392b; }
  .prospect-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .prospect-phone { font-size: 12px; color: #888; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .badge-pending { background: #f0f0f0; color: #666; }
  .badge-contacted { background: #dbeafe; color: #1d4ed8; }
  .badge-waiting_yes,.badge-waiting_name,.badge-waiting_items,.badge-waiting_location { background: #fef3c7; color: #d97706; }
  .badge-done,.badge-approved { background: #d1fae5; color: #065f46; }
  .badge-responded,.badge-collecting,.badge-review { background: #fef3c7; color: #d97706; }
  .badge-denied,.badge-not_interested { background: #fee2e2; color: #991b1b; }
  .badge-needs_human { background: #ede9fe; color: #5b21b6; }
  .filters { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; }
  .filters button { width: auto; padding: 4px 10px; font-size: 12px; background: #f0f0f0; color: #444; font-weight: 500; }
  .filters button.on { background: #c0392b; color: #fff; }
  .box { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; font-size: 14px; }
  .box h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #999; margin-bottom: 8px; }
  .box dl { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; }
  .box dt { color: #888; } .box dd { color: #222; }
  .act { display: inline-block; width: auto; margin: 0 8px 8px 0; padding: 8px 16px; font-size: 13px; }
  .act.secondary { background: #444; }
  .badge-opted_out { background: #f0f0f0; color: #999; }
  .badge-invalid { background: #fee2e2; color: #991b1b; }
  .detail { flex: 1; overflow-y: auto; padding: 24px; }
  .detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 15px; }
  .detail-header { margin-bottom: 20px; }
  .detail-header h2 { font-size: 20px; }
  .detail-header p { color: #666; font-size: 14px; margin-top: 4px; }
  .thread { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
  .msg-out { background: #c0392b; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg-in { background: #f0f0f0; color: #222; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg-time { font-size: 11px; opacity: .65; margin-top: 4px; }
  .approve-btn { margin-top: 20px; padding: 10px 24px; background: #065f46; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .approve-btn:hover { background: #047857; }
  #toast { position: fixed; bottom: 24px; right: 24px; background: #222; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; display: none; z-index: 999; }
</style>
</head>
<body>

<div id="login">
  <div id="login-box">
    <h1>559eats Admin</h1>
    <p>Vendor SMS outreach</p>
    <input type="password" id="pwd" placeholder="Your admin password" />
    <button onclick="doLogin()">Sign In</button>
    <p id="login-err" style="color:#c0392b;margin-top:10px;display:none"></p>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>Vendor SMS outreach</h1>
    <span class="stat">Total: <strong id="st-total">-</strong></span>
    <span class="stat">In conversation: <strong id="st-talking">-</strong></span>
    <span class="stat">Approved: <strong id="st-approved">-</strong></span>
    <span class="stat">Needs you: <strong id="st-human">-</strong></span>
    <a href="/admin" style="font-size:13px;color:#c0392b">Back to admin</a>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="filters" id="filters"></div>
      <div id="prospect-list"></div>
    </div>
    <div class="detail" id="detail">
      <div class="detail-empty">Select a vendor to see the conversation</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/admin-auth.js"></script>
<script>
let prospects = [];
let selectedId = null;
let filter = 'all';
const FILTERS = { all: 'All', needs_human: 'Needs you', review: 'In review', collecting: 'Talking', approved: 'Approved', denied: 'Denied', pending: 'Not texted', opted_out: 'Opted out' };

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function doLogin() {
  const err = document.getElementById('login-err');
  try { await Admin.login(document.getElementById('pwd').value); showApp(); }
  catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}
document.getElementById('pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
Admin.check().then((ok) => { if (ok) showApp(); });

async function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  await loadProspects();
}

async function loadProspects() {
  prospects = (await Admin.api('prospects?select=*&order=updated_at.desc')) || [];
  renderFilters(); renderList(); updateStats(); renderDetail();
}

function renderFilters() {
  document.getElementById('filters').innerHTML = Object.entries(FILTERS).map(([k, v]) =>
    `<button class="${filter === k ? 'on' : ''}" onclick="filter='${k}';renderFilters();renderList()">${v}</button>`).join('');
}

function visible() {
  if (filter === 'all') return prospects;
  if (filter === 'collecting') return prospects.filter((p) => ['contacted', 'responded', 'collecting'].includes(p.status));
  return prospects.filter((p) => p.status === filter);
}

function renderList() {
  const list = visible();
  document.getElementById('prospect-list').innerHTML = list.length ? list.map((p) =>
    `<div class="prospect ${selectedId === p.id ? 'active' : ''}" onclick="selectProspect('${p.id}')">
      <div class="prospect-name">${esc(p.name || p.collected_data?.business_name || p.phone)} <span class="badge badge-${esc(p.status)}">${esc(p.status)}</span></div>
      <div class="prospect-phone">${esc(p.phone)} · ${esc(p.source || '')}</div></div>`).join('')
    : '<p style="padding:16px;color:#aaa;font-size:14px">Nothing here</p>';
}

function updateStats() {
  document.getElementById('st-total').textContent = prospects.length;
  document.getElementById('st-talking').textContent = prospects.filter((p) => ['contacted', 'responded', 'collecting', 'review'].includes(p.status)).length;
  document.getElementById('st-approved').textContent = prospects.filter((p) => p.status === 'approved').length;
  document.getElementById('st-human').textContent = prospects.filter((p) => p.status === 'needs_human').length;
}

function selectProspect(id) { selectedId = id; renderList(); renderDetail(); }

function fmtSchedule(s) {
  if (!Array.isArray(s) || !s.length) return '';
  return s.map((d) => d.closed ? `${d.day}: closed` : `${d.day} ${d.open || '?'}-${d.close || '?'}`).join(', ');
}

function renderDetail() {
  const p = prospects.find((x) => x.id === selectedId);
  if (!p) return;
  const c = p.collected_data || {};
  const app = c.website_application || {};
  const conv = p.conversation || [];
  const msgs = conv.map((m) => {
    const out = m.role === 'agent' || m.direction === 'outbound' || m.role === 'outbound';
    return `<div class="msg msg-${out ? 'out' : 'in'}">${esc(m.text)}<div class="msg-time">${m.at || m.ts ? new Date(m.at || m.ts).toLocaleString() : ''}</div></div>`;
  }).join('');
  const rows = [
    ['Business', c.business_name || p.name], ['Food', c.food_type || app.food_type], ['Schedule', fmtSchedule(c.schedule) || c.schedule_notes],
    ['Location', c.street_address || c.cross_streets ? `${c.street_address || c.cross_streets}, ${c.city || ''}` : p.address],
    ['Moves around', c.location_changes == null ? '' : (c.location_changes ? 'Yes' : 'No')], ['Social', c.social || app.instagram],
    ['Contact', c.contact_name || app.owner_name], ['Email', app.email], ['Notes', app.notes || c.location_notes],
  ].filter((r) => r[1]);
  const canText = p.status === 'pending' && !(p.outreach_count > 0);
  const canReview = ['review', 'needs_human', 'collecting', 'denied'].includes(p.status) && (c.business_name || p.name);
  document.getElementById('detail').innerHTML =
    `<div class="detail-header"><h2>${esc(c.business_name || p.name || 'Unknown')}</h2>
      <p>${esc(p.phone)} · Status: <span class="badge badge-${esc(p.status)}">${esc(p.status)}</span> · Source: ${esc(p.source || '')}</p></div>
    ${p.ai_decision ? `<div class="box"><h3>AI decision</h3><strong>${esc(p.ai_decision)}</strong>: ${esc(p.ai_reason || '')}</div>` : (p.ai_reason ? `<div class="box"><h3>Note</h3>${esc(p.ai_reason)}</div>` : '')}
    ${rows.length ? `<div class="box"><h3>What we have</h3><dl>${rows.map((r) => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></div>` : ''}
    <div>
      ${canText ? `<button class="act" onclick="sendIntro('${p.id}')">Send intro text</button>` : ''}
      ${canReview ? `<button class="act secondary" onclick="rerunReview('${p.id}')">Run AI approval now</button>` : ''}
      ${p.restaurant_id ? `<a class="act" style="text-decoration:none;color:#fff;background:#065f46;border-radius:8px" href="/truck/${esc(p.restaurant_id)}" target="_blank">View live listing</a>` : ''}
    </div>
    <div class="box"><h3>Conversation</h3><div class="thread">${msgs || '<p style="color:#aaa;font-size:14px">No messages yet</p>'}</div></div>`;
}

async function bridge(payload) {
  const r = await fetch('/api/vendor-sms', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (sessionStorage.getItem('559eats-admin-token') || '') }, body: JSON.stringify(payload) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
  return d;
}

async function sendIntro(id) {
  if (!confirm('Only text vendors who asked to be contacted or texted you first. Send the intro text now?')) return;
  try {
    const d = await bridge({ action: 'outreach', prospect_ids: [id] });
    const r = (d.results || [])[0];
    showToast(r && r.ok ? 'Intro text sent' : 'Not sent: ' + ((r && r.err) || d.error || 'unknown'));
  } catch (e) { showToast(e.message); }
  await loadProspects();
}

async function rerunReview(id) {
  try { const d = await bridge({ action: 'review', prospect_id: id }); showToast('AI decision: ' + (d.decision || d.error || 'done')); }
  catch (e) { showToast(e.message); }
  await loadProspects();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3500);
}
</script>
</body>
</html>
