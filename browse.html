  .page-header { background: var(--dark); padding: 56px 24px 48px; text-align: center; }

  .filter-inner { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }

  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.1); }
  .card-img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #e8e0d8; }
  .card-body { padding: 16px; }
  .card-badges { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge { padding: 3px 10px; border-radius: 50px; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }

  .card-cuisine { font-size: .82rem; color: var(--orange); font-weight: 500; margin-bottom: 6px; }
  .card-meta { font-size: .8rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 80px 24px; }
  .empty-icon { font-size: 3rem; margin-bottom: 16px; }
  .empty h3 { font-size: 1.3rem; margin-bottom: 8px; }
  .empty p { color: var(--muted); font-size: .95rem; }
  .skeleton { animation: shimmer 1.4s infinite; background: linear-gradient(90deg,#f0ebe6 25%,#e8e0d8 50%,#f0ebe6 75%); background-size: 200% 100%; border-radius: 8px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .skel-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
  .skel-img { height: 180px; }
  .skel-body { padding: 16px; }
  .skel-line { height: 14px; margin-bottom: 10px; }
  .skel-line.short { width: 60%; }
  .skel-line.med { width: 80%; }
  footer { background: var(--dark); color: rgba(255,255,255,.5); text-align: center; padding: 32px 24px; font-size: .82rem; }
  footer a { color: rgba(255,255,255,.7); text-decoration: none; }
  @media (max-width: 600px) { .nav-links { display: none; } .sort-wrap { margin-left: 0; width: 100%; } #sortSelect { width: 100%; } }
</style>

<script>
const SUPA = 'https://wlpugteoycouvvnhamnm.supabase.co';
const KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndscHVndGVveWNvdXZ2bmhhbW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzY3MjksImV4cCI6MjA5MTQxMjcyOX0.RndK-tL1KG7Yg23JxtMqRlv5rECd6ppJubwNwoM2d5g';
const FOOD_PHOTOS = {
  Mexican:'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=600&q=80',
  American:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&q=80',
  Asian:'https://images.unsplash.com/photo-1569050467447-ce54b3bbc37d?w=600&q=80',
  BBQ:'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=600&q=80',
  Seafood:'https://images.unsplash.com/photo-1534482421-64566f976cfa?w=600&q=80',
  Italian:'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&q=80',
  Dessert:'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600&q=80',
  default:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&q=80'
};
let allData=[],activeFilter='all',searchQuery='',sortMode='name';
async function loadData(){
  try{
    const r=await fetch(SUPA+'/rest/v1/restaurants?select=*&is_active=eq.true&order=name.asc&limit=500',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    if(!r.ok)throw new Error('fetch failed');
    allData=await r.json();
  }catch(e){allData=[];}
  render();
}
function getPhoto(r){
  if(r.photo_url)return r.photo_url;
  const c=r.cuisine_type||'';
  for(const[k,v]of Object.entries(FOOD_PHOTOS)){if(c.toLowerCase().includes(k.toLowerCase()))return v;}
  return FOOD_PHOTOS.default;
}
function getSlug(r){return r.slug||r.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function matchesFilter(r){if(activeFilter==='all')return true;if(activeFilter==='truck')return r.is_food_truck;return(r.cuisine_type||'').toLowerCase().includes(activeFilter.toLowerCase());}
function matchesSearch(r){if(!searchQuery)return true;const q=searchQuery.toLowerCase();return(r.name||'').toLowerCase().includes(q)||(r.cuisine_type||'').toLowerCase().includes(q)||(r.neighborhood||'').toLowerCase().includes(q)||(r.address||'').toLowerCase().includes(q);}
function sortData(arr){const c=[...arr];if(sortMode==='name')c.sort((a,b)=>a.name.localeCompare(b.name));if(sortMode==='name_desc')c.sort((a,b)=>b.name.localeCompare(a.name));if(sortMode==='featured')c.sort((a,b)=>(b.is_featured?1:0)-(a.is_featured?1:0));if(sortMode==='truck')c.sort((a,b)=>(b.is_food_truck?1:0)-(a.is_food_truck?1:0));return c;}
function render(){
  const filtered=sortData(allData.filter(r=>matchesFilter(r)&&matchesSearch(r)));
  document.getElementById('resultCount').textContent=filtered.length;
  const grid=document.getElementById('grid');
  if(filtered.length===0){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">Ã°ÂÂÂ½Ã¯Â¸Â</div><h3>'+(allData.length===0?'No listings yet':'No results found')+'</h3><p>'+(allData.length===0?'Be the first to <a href="/apply.html" style="color:var(--orange)">add your spot</a>!':'Try a different search or filter.')+'</p></div>';return;}
  grid.innerHTML=filtered.map(r=>{
    const slug=getSlug(r),photo=getPhoto(r);
    const badges=[r.is_food_truck?'<span class="badge badge-truck">Food Truck</span>':'',r.is_featured?'<span class="badge badge-featured">Featured</span>':'',r.is_sponsored?'<span class="badge badge-sponsored">Sponsored</span>':''].filter(Boolean).join('');
    return '<a class="card" href="/truck/'+r.id+'"><img class="card-img" src="'+photo+'" alt="'+r.name+'" loading="lazy" onerror="this.hidden=true"><div class="card-body">'+(badges?'<div class="card-badges">'+badges+'</div>':'')+'<div class="card-name">'+r.name+'</div>'+(r.cuisine_type?'<div class="card-cuisine">'+r.cuisine_type+'</div>':'')+'<div class="card-meta">'+(r.neighborhood?'<span>Ã°ÂÂÂ '+r.neighborhood+'</span>':'')+(r.phone?'<span>Ã°ÂÂÂ '+r.phone+'</span>':'')+'</div></div></a>';
  }).join('');
}
document.getElementById('pills').addEventListener('click',e=>{const p=e.target.closest('.pill');if(!p)return;document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');activeFilter=p.dataset.filter;render();});
let t;document.getElementById('searchInput').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{searchQuery=e.target.value.trim();render();},220);});
document.getElementById('sortSelect').addEventListener('change',e=>{sortMode=e.target.value;render();});
loadData();
</script>
