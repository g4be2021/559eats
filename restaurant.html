<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">Restaurant &mdash; 559eats</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--orange:#E8512A;--orange-dark:#c73e18;--orange-light:#f9ede8;--cream:#faf7f4;--dark:#1a1310;--text:#2d2420;--muted:#7a6e6a;--border:#e8e0da;--white:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}html{scroll-behavior:smooth}body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:64px;background:rgba(250,247,244,.85);backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(232,224,218,.6);transition:background .3s,box-shadow .3s}nav.scrolled{background:rgba(250,247,244,.97);box-shadow:0 2px 20px rgba(0,0,0,.08)}.nav-logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:800;color:var(--orange);text-decoration:none}.nav-links{display:flex;align-items:center;gap:8px}.nav-links a{font-size:.9rem;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px;transition:color .2s,background .2s}.nav-links a:hover{color:var(--text);background:var(--border)}.nav-cta{background:var(--orange)!important;color:var(--white)!important;padding:8px 20px!important;border-radius:999px!important;font-weight:600!important}.nav-cta:hover{background:var(--orange-dark)!important}.page-hero{padding:120px 24px 60px;text-align:center;background:linear-gradient(160deg,#2d1a14 0%,#4a2218 60%,#E8512A 100%)}.page-hero .eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:12px;display:block}.page-hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;color:#fff;margin-bottom:16px;line-height:1.1}.page-hero p{font-size:1.05rem;color:rgba(255,255,255,.8);max-width:520px;margin:0 auto}.container{max-width:1100px;margin:0 auto;padding:60px 24px}footer{background:var(--dark);color:rgba(255,255,255,.55);text-align:center;padding:36px 24px;font-size:.875rem}footer a{color:rgba(255,255,255,.75);text-decoration:none}footer a:hover{color:var(--orange)}.footer-links{display:flex;gap:24px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}@media(max-width:768px){nav{padding:0 16px}.nav-links a:not(.nav-cta){display:none}}
  .r-hero{position:relative;height:380px;background:#2d1a14;overflow:hidden;margin-top:64px}
  .r-hero img{width:100%;height:100%;object-fit:cover;opacity:.7}
  .r-hero-placeholder{width:100%;height:100%;background:linear-gradient(135deg,#2d1a14,#4a2218);display:flex;align-items:center;justify-content:center;font-size:6rem}
  .r-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%)}
  .r-hero-info{position:absolute;bottom:0;left:0;right:0;padding:28px 32px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .r-name{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;color:#fff;line-height:1.1;text-shadow:0 2px 16px rgba(0,0,0,.5)}
  .r-meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .r-badge{padding:5px 14px;border-radius:999px;font-size:.8rem;font-weight:700;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff}
  .r-badge.open{background:rgba(22,163,74,.85)}
  .r-cta-btn{background:var(--orange);color:#fff;font-weight:700;padding:12px 24px;border-radius:999px;text-decoration:none;white-space:nowrap;transition:background .2s,transform .15s;flex-shrink:0}
  .r-cta-btn:hover{background:var(--orange-dark);transform:translateY(-1px)}
  .r-layout{display:grid;grid-template-columns:1fr 320px;gap:36px;max-width:1100px;margin:0 auto;padding:40px 24px}
  .r-main{}
  .r-section{margin-bottom:36px}
  .r-section h3{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:1.5px solid var(--border)}
  .r-desc{color:var(--muted);line-height:1.75;font-size:.97rem}
  .info-card{background:var(--white);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
  .info-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-size:.9rem}
  .info-row:last-child{margin-bottom:0}
  .info-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px}
  .info-row strong{display:block;font-weight:600;color:var(--text);font-size:.85rem;margin-bottom:1px}
  .info-row span,.info-row a{color:var(--muted);text-decoration:none;font-size:.88rem}
  .info-row a:hover{color:var(--orange)}
  .share-btn{width:100%;background:var(--orange-light);color:var(--orange-dark);border:none;padding:12px;border-radius:999px;font-weight:700;cursor:pointer;transition:background .2s}
  .share-btn:hover{background:#f0d0c5}
  .nearby-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .nearby-card{background:var(--white);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .2s}
  .nearby-card:hover{transform:translateY(-2px)}
  .nearby-card-img{height:70px;background:var(--orange-light);display:flex;align-items:center;justify-content:center;font-size:2rem}
  .nearby-card-body{padding:10px 12px}
  .nearby-card-name{font-weight:700;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nearby-card-meta{font-size:.75rem;color:var(--muted)}
  @media(max-width:768px){.r-layout{grid-template-columns:1fr}.r-hero{height:260px}.r-hero-info{padding:16px}}
</style></head>
<body>
<nav id="nav"><a href="/" class="nav-logo">559eats</a><div class="nav-links"><a href="/browse.html">Browse</a><a href="/map.html">Map</a><a href="/catering.html">Catering</a><a href="/browse.html">Food trucks</a><a href="/apply.html" class="nav-cta">List your spot</a></div></nav>
<div id="rHero" class="r-hero"><div class="r-hero-placeholder">&#127860;</div><div class="r-hero-overlay"></div><div class="r-hero-info"><div><div class="r-name" id="rName">Loading&hellip;</div><div class="r-meta-row" id="rMetaRow"></div></div><a href="#" id="rCtaBtn" class="r-cta-btn" style="display:none">Get directions</a></div></div>
<div class="r-layout">
  <div class="r-main">
    <div class="r-section">
      <h3>About</h3>
      <div class="r-desc" id="rDesc">Loading&hellip;</div>
    </div>
    <div class="r-section" id="hoursSection" style="display:none">
      <h3>Hours</h3>
      <div id="rHours" class="r-desc"></div>
    </div>
  </div>
  <div class="r-sidebar">
    <div class="info-card" id="infoCard"></div>
    <button class="share-btn" onclick="shareIt()">&#127757; Share this spot</button>
    <div style="margin-top:28px">
      <h3 style="font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:14px">More spots nearby</h3>
      <div class="nearby-grid" id="nearbyGrid"></div>
    </div>
  </div>
</div>
<footer><div class="footer-links"><a href="/apply.html">List your restaurant</a><a href="/contact.html">Contact</a><a href="/about.html">About</a></div><p>559eats &middot; Celebrating local food in the Central Valley</p></footer>
<script>
window.addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',scrollY>40),{passive:true});
const SUPA='https://wlpugteoycouvvnhamnm.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndscHVndGVveWNvdXZ2bmhhbW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzY3MjksImV4cCI6MjA5MTQxMjcyOX0.RndK-tL1KG7Yg23JxtMqRlv5rECd6ppJubwNwoM2d5g';

(async()=>{
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  function showError(msg) {
    document.title = 'Not Found — 559eats';
    document.getElementById('rName').textContent = 'Listing Not Found';
    document.getElementById('rDesc').textContent = msg || 'This listing may have moved or been removed.';
    document.getElementById('rHero').style.display = 'none';
    document.getElementById('rMetaRow').style.display = 'none';
    document.getElementById('hoursSection').style.display = 'none';
    document.getElementById('infoCard').style.display = 'none';
    document.getElementById('rCtaBtn').style.display = 'none';
    document.getElementById('nearbyGrid').innerHTML = '';
  }

  if (!id) { showError('No listing ID provided.'); return; }

  try {
    const r = await fetch(SUPA+'/rest/v1/restaurants?id=eq.'+id+'&select=id,name,cuisine_type,neighborhood,address,latitude,longitude,phone,website,description,is_food_truck,is_active&limit=1', {
      headers: { apikey: KEY, Authorization: 'Bearer '+KEY }
    });
    const data = await r.json();
    if (!Array.isArray(data) || data.length === 0) { showError('Spot not found.'); return; }
    const d = data[0];

    document.title = (d.name||'Restaurant')+' — 559eats';
    document.getElementById('rName').textContent = d.name || '';
    document.getElementById('rDesc').textContent = d.description || '';

    const heroEl = document.getElementById('rHero');
    if (d.is_food_truck) {
      heroEl.style.background = 'linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)';
    }

    const meta = [];
    if (d.cuisine_type) meta.push(d.cuisine_type);
    if (d.neighborhood) meta.push(d.neighborhood);
    if (d.is_food_truck) meta.push('Food Truck');
    document.getElementById('rMetaRow').innerHTML = meta.map(m=>'<span class="tag">'+m+'</span>').join('');

    const ic = document.getElementById('infoCard');
    let icHTML = '';
    if (d.address) icHTML += '<p><strong>Address:</strong> '+d.address+'</p>';
    if (d.phone) icHTML += '<p><strong>Phone:</strong> <a href="tel:'+d.phone+'">'+d.phone+'</a></p>';
    if (d.website) icHTML += '<p><strong>Website:</strong> <a href="'+d.website+'" target="_blank" rel="noopener">'+d.website+'</a></p>';
    ic.innerHTML = icHTML;

    const btn = document.getElementById('rCtaBtn');
    if (d.address) {
      btn.href = 'https://maps.google.com/?q='+encodeURIComponent(d.address);
      btn.textContent = 'Get Directions';
    } else {
      btn.style.display = 'none';
    }

    // Nearby listings
    try {
      const nq = SUPA+'/rest/v1/restaurants?select=id,name,cuisine_type,neighborhood&is_active=eq.true&id=neq.'+id+'&limit=4';
      const nr = await fetch(nq, { headers: { apikey: KEY, Authorization: 'Bearer '+KEY } });
      const nearby = await nr.json();
      if (Array.isArray(nearby) && nearby.length) {
        document.getElementById('nearbyGrid').innerHTML = nearby.map(x=>
          '<a href="/restaurant?id='+x.id+'" class="card"><div class="card-body"><h3>'+x.name+'</h3><p>'+[x.cuisine_type,x.neighborhood].filter(Boolean).join(' · ')+'</p></div></a>'
        ).join('');
      }
    } catch(e) {}

  } catch(err) {
    showError('Could not load listing details.');
  }
})();
</script></body></html>
