<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>559eats — Fresno's Food Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--orange:#E8512A;--dark:#1a1a2e;--card-bg:#fff;--radius:12px}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif}

/* Full-screen map */
#map{position:fixed;inset:0;z-index:0}

/* Floating nav */
#nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(26,26,46,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#nav .logo{font-family:'Playfair Display',serif;font-size:1.4rem;color:#fff;text-decoration:none}
#nav .logo span{color:var(--orange)}
#nav-links{display:flex;gap:20px;align-items:center}
#nav-links a{color:rgba(255,255,255,0.8);text-decoration:none;font-size:.85rem;font-weight:500;transition:color .2s}
#nav-links a:hover{color:#fff}
#nav-links a.active{color:var(--orange)}

/* Search bar */
#searchWrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:900;width:min(480px,90vw)}
#searchInput{width:100%;padding:12px 18px 12px 42px;border-radius:50px;border:none;font-size:.95rem;font-family:'Inter',sans-serif;background:rgba(255,255,255,0.97);box-shadow:0 4px 20px rgba(0,0,0,0.25);outline:none}
#searchInput::placeholder{color:#999}
#searchIcon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#999;pointer-events:none;font-size:1rem}

/* Filter pills */
#filters{position:fixed;top:130px;left:50%;transform:translateX(-50%);z-index:900;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;max-width:95vw;padding:0 4px;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
.pill{padding:7px 16px;border-radius:50px;border:none;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,0.92);color:#333;box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:all .2s}
.pill:hover{background:#fff;transform:translateY(-1px)}
.pill.active{background:var(--orange);color:#fff}

/* Map legend */
#legend{position:fixed;bottom:24px;left:16px;z-index:900;background:rgba(26,26,46,0.85);backdrop-filter:blur(6px);border-radius:10px;padding:10px 14px;color:#fff;font-size:.75rem}
#legend div{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#legend div:last-child{margin-bottom:0}
.leg-dot{width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;flex-shrink:0}

/* Spot count badge */
#spotCount{position:fixed;bottom:24px;right:16px;z-index:900;background:rgba(26,26,46,0.85);backdrop-filter:blur(6px);border-radius:10px;padding:10px 16px;color:#fff;font-size:.8rem;font-weight:600}

/* Leaflet popup overrides */
.leaflet-popup-content-wrapper{border-radius:var(--radius)!important;padding:0!important;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.2)!important;min-width:240px}
.leaflet-popup-content{margin:0!important;width:auto!important}
.leaflet-popup-tip-container{display:none}
.spot-popup{padding:16px}
.spot-popup h3{font-size:1rem;font-weight:700;color:var(--dark);margin-bottom:4px;line-height:1.3}
.spot-popup .sp-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.spot-popup .sp-tag{font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:50px;background:#f0f0f0;color:#555}
.spot-popup .sp-tag.truck{background:#fff3ee;color:var(--orange)}
.spot-popup .sp-info{font-size:.78rem;color:#666;margin-bottom:10px;line-height:1.5}
.spot-popup .sp-btns{display:flex;gap:8px}
.sp-btn{flex:1;padding:8px 10px;border-radius:8px;border:none;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:block}
.sp-btn.primary{background:var(--orange);color:#fff}
.sp-btn.secondary{background:#f5f5f5;color:var(--dark)}
.sp-btn:hover{opacity:.85}
</style>
</head>
<body>

<div id="map"></div>

<nav id="nav">
  <a class="logo" href="/"><span>559</span>eats</a>
  <div id="nav-links">
    <a href="/" class="active">Map</a>
    <a href="/browse">Browse</a>
    <a href="/catering.html">Catering</a>
    <a href="/about.html">About</a>
    <a href="/apply.html" style="background:var(--orange);color:#fff;padding:7px 16px;border-radius:50px;font-size:.82rem">List Your Spot</a>
  </div>
</nav>

<div id="searchWrap">
  <span id="searchIcon">🔍</span>
  <input id="searchInput" type="text" placeholder="Search restaurants, cuisine, neighborhood…">
</div>

<div id="filters">
  <button class="pill active" data-filter="all">All</button>
  <button class="pill" data-filter="food_truck">Food Trucks</button>
  <button class="pill" data-filter="mexican">Mexican</button>
  <button class="pill" data-filter="american">American</button>
  <button class="pill" data-filter="asian">Asian</button>
  <button class="pill" data-filter="bbq">BBQ</button>
  <button class="pill" data-filter="seafood">Seafood</button>
  <button class="pill" data-filter="italian">Italian</button>
  <button class="pill" data-filter="dessert">Dessert</button>
</div>

<div id="legend">
  <div><span class="leg-dot" style="background:var(--orange)"></span>Food Truck</div>
  <div><span class="leg-dot" style="background:#1a1310"></span>Restaurant</div>
</div>

<div id="spotCount">Loading…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPA='https://wlpugteoycouvvnhamnm.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndscHVndGVveWNvdXZ2bmhhbW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzY3MjksImV4cCI6MjA5MTQxMjcyOX0.RndK-tL1KG7Yg23JxtMqRlv5rECd6ppJubwNwoM2d5g';

// Init map centered on Fresno
const map = L.map('map',{zoomControl:false}).setView([36.7378,-119.7871],13);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom:19
}).addTo(map);

let allSpots=[], activeFilter='all', searchQuery='', markers=[];

function makeIcon(truck){
  const color=truck?'#E8512A':'#1a1310';
  return L.divIcon({
    className:'',
    html:'<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:'+color+';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4)"></div>',
    iconSize:[22,22],
    iconAnchor:[11,22],
    popupAnchor:[0,-24]
  });
}

function makePopup(r){
  const tags=[];
  if(r.is_food_truck) tags.push('<span class="sp-tag truck">Food Truck</span>');
  if(r.cuisine_type) tags.push('<span class="sp-tag">'+r.cuisine_type+'</span>');
  if(r.neighborhood) tags.push('<span class="sp-tag">'+r.neighborhood+'</span>');
  let info='';
  if(r.address) info+='📍 '+r.address+'<br>';
  if(r.phone) info+='📞 <a href="tel:'+r.phone+'" style="color:var(--orange);text-decoration:none">'+r.phone+'</a>';
  const mapsUrl=r.address?'https://maps.google.com/?q='+encodeURIComponent(r.address):'#';
  return '<div class="spot-popup">'
    +'<h3>'+r.name+'</h3>'
    +(tags.length?'<div class="sp-tags">'+tags.join('')+'</div>':'')
    +(info?'<div class="sp-info">'+info+'</div>':'')
    +'<div class="sp-btns">'
    +'<a class="sp-btn primary" href="/restaurant?id='+r.id+'" target="_blank">View Details</a>'
    +(r.address?'<a class="sp-btn secondary" href="'+mapsUrl+'" target="_blank">Directions</a>':'')
    +'</div>'
    +'</div>';
}

function matches(r){
  if(activeFilter==='food_truck' && !r.is_food_truck) return false;
  if(activeFilter!=='all' && activeFilter!=='food_truck'){
    const c=(r.cuisine_type||'').toLowerCase();
    if(!c.includes(activeFilter)) return false;
  }
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    const haystack=(r.name+' '+(r.cuisine_type||'')+' '+(r.neighborhood||'')).toLowerCase();
    if(!haystack.includes(q)) return false;
  }
  return true;
}

function renderMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  const visible=allSpots.filter(matches);
  visible.forEach(r=>{
    if(!r.latitude||!r.longitude) return;
    const m=L.marker([r.latitude,r.longitude],{icon:makeIcon(r.is_food_truck)})
      .bindPopup(makePopup(r),{maxWidth:280})
      .addTo(map);
    markers.push(m);
  });
  document.getElementById('spotCount').textContent=visible.length+' spot'+(visible.length!==1?'s':'');
}

async function loadSpots(){
  try{
    const r=await fetch(SUPA+'/rest/v1/restaurants?select=id,name,cuisine_type,neighborhood,address,latitude,longitude,phone,is_food_truck,is_active&is_active=eq.true&order=name.asc&limit=500',{
      headers:{apikey:KEY,Authorization:'Bearer '+KEY}
    });
    allSpots=await r.json();
    renderMarkers();
  }catch(e){
    document.getElementById('spotCount').textContent='Could not load spots';
  }
}

// Filter pills
document.querySelectorAll('.pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter=btn.dataset.filter;
    renderMarkers();
  });
});

// Search
let searchTimer;
document.getElementById('searchInput').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    searchQuery=e.target.value.trim();
    renderMarkers();
  },200);
});

loadSpots();
</script>
</body>
</html>
