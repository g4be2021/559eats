    const hoodZoom = () => document.getElementById('map').classList.toggle('hood-pane-hidden', map.getZoom() < 11 || map.getZoom() > 14);

    let trucks = [], hours = [], markers = {}, me = null, meMarker = null, selected = null;

      r._live = Truck.liveSpot(r);
      r._pos = Truck.position(r);
      r._icon = Truck.cuisineIcon(r.cuisine_type);
      r._dist = me && r._pos ? Truck.distanceMiles(me, r._pos) : null;
      r._tier = Truck.tier(r);
      r._feat = r._tier > 0;
      return r;
    }

    function buildChips() {
      const cuisines = {};
      trucks.forEach((t) => { const c = (t.cuisine_type || '').trim(); if (c && c !== 'Other') cuisines[c] = (cuisines[c] || 0) + 1; });
      const base = [['all', 'All'], ['open', '🟢 Open now', 'green'], ['live', '📍 Here today'], ['fav', '❤ Saved']];
      const cz = Object.entries(cuisines).sort((a, b) => b[1] - a[1]).map(([c]) => ['c:' + c, Truck.cuisineIcon(c) + ' ' + c]);
      document.getElementById('chips').innerHTML = [...base, ...cz].map(([k, l, cls]) =>
        `<button class="chip ${cls || ''} ${filters.chip === k ? 'on' : ''}" data-k="${esc(k)}">${esc(l)}</button>`).join('');
    }
    document.getElementById('chips').addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      filters.chip = filters.chip === b.dataset.k && b.dataset.k !== 'all' ? 'all' : b.dataset.k;
      buildChips(); render();
    });

    function visible() {
      const q = filters.q.toLowerCase(), favs = Truck.favs();
      let list = trucks.filter((t) => {
        if (q && ![t.name, t.cuisine_type, t.neighborhood, t.address, t.today_spot, t.special].some((v) => (v || '').toLowerCase().includes(q))) return false;
        const c = filters.chip;
        if (c === 'open') return t._status.state === 'open';
        if (c === 'live') return !!t._live;
        if (c === 'fav') return favs.has(t.id);
        if (c.startsWith('c:')) return (t.cuisine_type || '') === c.slice(2);
        return true;
      });
      const rank = (t) => (t._live ? 0 : t._status.state === 'open' ? 1 : t._status.state === 'unknown' ? 2 : 3);
      // Featured (paid) trucks go first, then live / open / no hours / closed
      list.sort((a, b) => (b._tier - a._tier) || (me ? (a._dist ?? 1e9) - (b._dist ?? 1e9) : rank(a) - rank(b) || (a.name || '').localeCompare(b.name || '')));
      return list;
    }

    function pinHtml(t) {
      const cls = t._live ? 'live' : t._status.state;
      return `<div class="pin-wrap ${t._tier ? 't' + t._tier : ''}" data-id="${t.id}"><div class="pin ${cls} ${t._tier ? 't' + t._tier : ''}">${t._icon}${t._tier >= 2 || t._tier === 1 ? '<span class="star">★</span>' : ''}</div><div class="pin-label">${esc(t.name)}</div></div>`;
    }

    function popupHtml(t) {
      const s = t._status, pos = t._pos;
      const d = pos ? Truck.directionsLinks(pos[0], pos[1], t.name) : null;
      const fav = Truck.favs().has(t.id);
      const pillCls = t._live ? 'live' : s.state === 'open' ? 'open' : '';
      return `<div class="pop-photo" id="pp-${t.id}">${t._icon}</div>
        <div class="pop-body">
          <div class="pop-name">${esc(t.name)}${t._tier ? `<span class="feat-tag t${t._tier}">★ ${Truck.TIERS[t._tier]}</span>` : ''}</div>
          <div class="pop-meta">${esc([t.cuisine_type, t.neighborhood].filter(Boolean).join(' · '))}${t._dist != null ? ' · ' + t._dist.toFixed(1) + ' mi' : ''}</div>
          <span class="pill ${pillCls}">${esc(s.label)}</span>
          ${t._live && t._live.note ? `<div class="pop-line">📍 <strong>Today:</strong> ${esc(t._live.note)}</div>` : ''}
          ${s.todayText && !t._live ? `<div class="pop-line">🕒 Today: ${esc(s.todayText)}</div>` : ''}
          ${t.special && Truck.future(t.special_until) ? `<div class="pop-special">⭐ ${esc(t.special)}</div>` : ''}
          <div class="pop-actions">
            ${d ? `<a class="primary" href="${d.google}" target="_blank" rel="noopener">Directions</a>` : ''}
            <a href="/truck/${t.id}">Menu &amp; info</a>
            ${t.phone ? `<a href="tel:${esc(t.phone)}">Call</a>` : ''}
            <button onclick="shareTruck('${t.id}')">Share</button>
            <button onclick="favTruck('${t.id}', this)">${fav ? '❤ Saved' : '♡ Save'}</button>
            ${d ? `<a href="${d.apple}" target="_blank" rel="noopener">Apple Maps</a>` : ''}
          </div>
        </div>`;
    }

    async function loadPhoto(t) {
      if (t._photo !== undefined) { if (t._photo) setPhoto(t); return; }
      try {
        const r = await fetch(`${SUPA}/rest/v1/photos?restaurant_id=eq.${t.id}&select=url&order=is_primary.desc,sort_order.asc&limit=1`, { headers: H });
        const j = await r.json(); t._photo = (j[0] && j[0].url) || null;
      } catch { t._photo = null; }
      if (t._photo) setPhoto(t);
    }
    function setPhoto(t) { const el = document.getElementById('pp-' + t.id); if (el) { el.style.backgroundImage = `url("${t._photo.replace(/"/g, '%22')}")`; el.textContent = ''; } }

    function renderMarkers(list) {
      cluster.clearLayers(); premiumLayer.clearLayers(); markers = {};
      list.forEach((t) => {
        if (!t._pos) return;
        const m = L.marker(t._pos, { zIndexOffset: t._tier * 300 + (t._live ? 200 : t._status.state === 'open' ? 100 : 0), icon: L.divIcon({ className: '', html: pinHtml(t), iconSize: t._tier === 3 ? [52, 52] : t._tier === 2 ? [44, 44] : [40, 40], iconAnchor: t._tier === 3 ? [26, 26] : t._tier === 2 ? [22, 22] : [20, 20], popupAnchor: [0, -18] }), riseOnHover: true, title: t.name });
        m._open = t._status.state === 'open';
        m.bindPopup(() => popupHtml(t), { maxWidth: 300, autoPanPaddingTopLeft: [20, 80] });
        m.on('popupopen', () => { select(t.id, false); loadPhoto(t); history.replaceState(null, '', '?truck=' + t.id); });
        m.on('popupclose', () => { if (selected === t.id) select(null, false); history.replaceState(null, '', location.pathname); });
        (t._tier === 3 ? premiumLayer : cluster).addLayer(m); markers[t.id] = m;
      });
    }

    function renderList(list) {
      const favs = Truck.favs();
      const open = list.filter((t) => t._status.state === 'open').length;
      document.getElementById('count').textContent = `${list.length} truck${list.length === 1 ? '' : 's'}${open ? ` · ${open} open now` : ''}${me ? ' · sorted by distance' : ''}`;
      const el = document.getElementById('list');
      if (!list.length) {
        el.innerHTML = `<div class="empty">${filters.chip === 'fav' ? 'Tap ♡ on any truck to save it here.' : filters.chip === 'live' ? 'No trucks have posted today\'s spot yet.' : 'No trucks match that.'}</div>`;
        return;
      }
      el.innerHTML = list.map((t) => `
        <div class="card ${selected === t.id ? 'active' : ''} ${t._tier ? 't' + t._tier : ''}" data-id="${t.id}">
          <div class="avatar ${t._status.state}">${t._icon}${t._live ? '<span class="live-dot" title="Here now"></span>' : ''}</div>
          <div class="card-body">
            <div class="card-name">${esc(t.name)}${t._tier ? `<span class="feat-tag t${t._tier}">★ ${Truck.TIERS[t._tier]}</span>` : ''}</div>
            <div class="card-meta">${esc([t.cuisine_type, t._live ? t._live.note : t.neighborhood].filter(Boolean).join(' · '))}${t._dist != null ? ' · ' + t._dist.toFixed(1) + ' mi' : ''}</div>
            <div class="card-status ${t._status.state === 'open' ? 'open' : ''}">${esc(t._status.label)}</div>
            ${t.special && Truck.future(t.special_until) ? `<div class="card-special">⭐ ${esc(t.special)}</div>` : ''}
          </div>
          <button class="fav ${favs.has(t.id) ? 'on' : ''}" data-fav="${t.id}" title="Save">${favs.has(t.id) ? '❤' : '♡'}</button>
        </div>`).join('');
    }

    document.getElementById('list').addEventListener('click', (e) => {
      const f = e.target.closest('[data-fav]');
      if (f) { e.stopPropagation(); Truck.toggleFav(f.dataset.fav); render(); return; }
      const c = e.target.closest('.card'); if (c) openTruck(c.dataset.id);
    });
    // Hovering a card highlights its pin
    document.getElementById('list').addEventListener('mouseover', (e) => {
      const c = e.target.closest('.card');
      document.querySelectorAll('.pin-wrap.sel').forEach((p) => p.classList.remove('sel'));
      if (c) { const p = document.querySelector(`.pin-wrap[data-id="${c.dataset.id}"]`); if (p) p.classList.add('sel'); }
    });

    function select(id, scroll) {
      selected = id;
      document.querySelectorAll('.card').forEach((c) => c.classList.toggle('active', c.dataset.id === id));
      if (id && scroll) { const c = document.querySelector(`.card[data-id="${id}"]`); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    }

    function openTruck(id) {
      const t = trucks.find((x) => x.id === id); const m = markers[id];
      if (!t) return;
      document.body.classList.remove('list-view'); document.getElementById('viewToggle').textContent = '☰ List';
      if (!m) { location.href = '/truck/' + id; return; }
      if (premiumLayer.hasLayer(m)) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 14)); m.openPopup(); }
      else cluster.zoomToShowLayer(m, () => { map.panTo(m.getLatLng()); m.openPopup(); });
      select(id, true);
    }

    window.favTruck = (id, btn) => { const on = Truck.toggleFav(id); btn.textContent = on ? '❤ Saved' : '♡ Save'; renderList(visible()); };
    window.shareTruck = async (id) => {
      const t = trucks.find((x) => x.id === id);
      const res = await Truck.share(t.name + ' on 559eats', location.origin + '/truck/' + id);
      if (res === 'copied') toast('Link copied');
    };
    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => (t.style.display = 'none'), 2200); }

    function render() {
      trucks.forEach(enrich);
      const list = visible();
      renderMarkers(list); renderList(list); nowChip();
    }
    function nowChip() {
      let el = document.getElementById('nowChip');
      if (!el) {
        el = document.createElement('button'); el.id = 'nowChip'; el.className = 'now-chip'; el.type = 'button';
        el.addEventListener('click', () => { filters.chip = filters.chip === 'open' ? 'all' : 'open'; buildChips(); render(); });
        document.querySelector('.map-area').appendChild(el);
      }
      const n = trucks.filter((t) => t._live || t._status.state === 'open').length;
      const h = Number(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour: 'numeric', hour12: false }).format(new Date())) % 24;
      const when = h < 5 || h >= 21 ? '🌙 Late night' : h < 11 ? '☀️ Morning' : h < 15 ? '🌮 Lunch time' : h < 17 ? '🌤 Afternoon' : '🌆 Dinner time';
      el.innerHTML = n
        ? `${when} in the 559 · <em>${n} truck${n === 1 ? '' : 's'} open now</em>`
        : `${when} in the 559 · no trucks open right now`;
      el.title = filters.chip === 'open' ? 'Show all trucks' : 'Show only open trucks';
    }

    let qTimer;
    document.getElementById('q').addEventListener('input', (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { filters.q = e.target.value.trim(); render(); }, 150); });

    // Find my location: shared by the "Near me" button in the list and the arrow button on the map
    let locating = false;
    function locateMe(opts) {
      const btn = document.getElementById('nearBtn');
      const arrow = document.querySelector('.locate-btn');
      if (!navigator.geolocation) return toast('Location is not available on this device');
      if (locating) return;
      locating = true; btn.textContent = '📍 Finding...'; if (arrow) arrow.classList.add('busy');
      navigator.geolocation.getCurrentPosition((p) => {
        locating = false; if (arrow) { arrow.classList.remove('busy'); arrow.classList.add('on'); }
        me = [p.coords.latitude, p.coords.longitude]; btn.textContent = '📍 Near me'; btn.classList.add('on');
        if (meMarker) map.removeLayer(meMarker);
        meMarker = L.marker(me, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18] }), interactive: false }).addTo(map);
        map.setView(me, opts && opts.zoom ? opts.zoom : 13); render();
      }, (err) => {
        locating = false; if (arrow) arrow.classList.remove('busy');
        btn.textContent = '📍 Near me';
        toast(err && err.code === 1 ? 'Location is blocked. Turn it on for this site in your browser settings.' : 'Could not find your location. Try again.');
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    }

    document.getElementById('nearBtn').addEventListener('click', () => {
      const btn = document.getElementById('nearBtn');
      if (me) {
        me = null; btn.classList.remove('on'); if (meMarker) map.removeLayer(meMarker);
        const a = document.querySelector('.locate-btn'); if (a) a.classList.remove('on');
        render(); return;
      }
      locateMe();
    });

    // Navigation arrow on the map, under the zoom buttons
    const Locate = L.Control.extend({
      options: { position: 'topright' },
      onAdd() {
        const wrap = L.DomUtil.create('div', 'leaflet-bar locate-wrap');
        const b = L.DomUtil.create('button', 'locate-btn', wrap);
        b.type = 'button';
        b.title = 'Show my location';
        b.setAttribute('aria-label', 'Show my location');
        b.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 3 3 10.5l7.5 2.4L13 21z" fill="currentColor"/></svg>';
        L.DomEvent.disableClickPropagation(wrap);
        L.DomEvent.on(b, 'click', () => { if (me && meMarker) map.setView(me, Math.max(map.getZoom(), 14)); else locateMe({ zoom: 14 }); });
        return wrap;
      },
    });
    new Locate().addTo(map);

    document.getElementById('viewToggle').addEventListener('click', () => {
      const on = document.body.classList.toggle('list-view');
      document.getElementById('viewToggle').textContent = on ? '🗺 Map' : '☰ List';
      if (!on) setTimeout(() => map.invalidateSize(), 260);
    });

    async function init() {
      try {
        const cols = 'id,name,cuisine_type,neighborhood,address,latitude,longitude,phone,today_spot,today_lat,today_lng,today_until,open_override,open_override_until,special,special_until,is_featured,sponsored_until,sponsor_tier';
        const [r1, r2] = await Promise.all([
          fetch(`${SUPA}/rest/v1/restaurants?select=${cols}&is_active=eq.true&order=name.asc&limit=1000`, { headers: H }),
          fetch(`${SUPA}/rest/v1/hours?select=restaurant_id,day_of_week,open_time,close_time,is_closed&limit=10000`, { headers: H }),
        ]);
        trucks = await r1.json(); hours = r2.ok ? await r2.json() : [];
        if (!Array.isArray(trucks)) throw new Error('bad data');
        buildChips(); render(); labelZoom();
        const pts = trucks.map((t) => t._pos).filter(Boolean);
        const want = new URLSearchParams(location.search).get('truck');
        if (want && markers[want]) openTruck(want);
        else {
          // Start on Fresno/Clovis where most trucks are; zoom out to see the rest of the valley
          const local = pts.filter((p) => Truck.distanceMiles([36.78, -119.75], p) < 20);
          if (local.length) map.fitBounds(local, { padding: [40, 40], maxZoom: 13 });
          else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
        }
        // Refresh open/closed status every minute without reloading
        setInterval(() => { if (!selected) render(); }, 60000);
      } catch (e) {
        document.getElementById('list').innerHTML = '<div class="empty">Could not load trucks. Please refresh.</div>';
      }
    }
    init();
  </script>
<script src="/mobile-nav.js" defer></script><script src="/lang.js" defer></script><script src="/chat-widget.js" defer></script>
</body>
